<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- What a burial vault is, underneath (Martice 2026-11-27: "do them all" on the NorthStar audit list, incl. underground
       cutaways; drawn in the same style as the lawn crypt cutaway he asked for 11-15). Only what can't be photographed: the
       vault under the lawn, the casket inside it, the flat marker on top. Wording from our vault guide: lined and sealed to
       resist water (never "keeps water out"), carries the weight of the earth, keeps the ground level. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fbfd3"/><stop offset="1" stop-color="#dfeaf0"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d4330"/><stop offset=".6" stop-color="#3d2c20"/><stop offset="1" stop-color="#2a1f17"/></linearGradient>
    <linearGradient id="conc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2dfd9"/><stop offset="1" stop-color="#b9b4ab"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9a6a42"/><stop offset="1" stop-color="#6b4527"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8d9196"/><stop offset="1" stop-color="#5f6368"/></linearGradient>
  </defs>
  <rect width="1600" height="300" fill="url(#sky)"/>
  <g fill="#6f8f6a" opacity=".55"><ellipse cx="180" cy="270" rx="140" ry="70"/><ellipse cx="420" cy="262" rx="90" ry="60"/><ellipse cx="1500" cy="268" rx="130" ry="64"/></g>
  <rect y="290" width="1600" height="610" fill="url(#soil)"/>
  <g stroke="#6b4e38" stroke-width="2" opacity=".5" fill="none"><path d="M0 420 C 300 410, 600 432, 1600 414"/><path d="M0 560 C 400 548, 800 572, 1600 552"/><path d="M0 720 C 500 708, 900 730, 1600 712"/></g>
  <rect y="278" width="1600" height="30" fill="#6fa04a"/>
  <rect y="270" width="1600" height="12" fill="#86b864"/>
  <g fill="#5e8f3c"><path d="M60 272 l6 -16 l5 16Z"/><path d="M260 272 l5 -14 l5 14Z"/><path d="M520 272 l6 -17 l5 17Z"/><path d="M780 272 l5 -15 l5 15Z"/><path d="M1460 272 l6 -16 l5 16Z"/><path d="M1560 272 l5 -14 l5 14Z"/></g>
  <!-- the flat granite marker, level with the lawn -->
  <rect x="1150" y="258" width="200" height="24" rx="3" fill="url(#stone)"/>
  <!-- the vault: a concrete box with its lid, the casket inside -->
  <g stroke="#8f8a82" stroke-width="5">
    <rect x="960" y="430" width="580" height="300" rx="14" fill="url(#conc)"/>
    <rect x="944" y="404" width="612" height="40" rx="10" fill="#cfcbc4"/>
  </g>
  <rect x="980" y="458" width="540" height="252" rx="8" fill="#d9d5ce" stroke="#a39e95" stroke-width="3"/>
  <rect x="1010" y="520" width="480" height="150" rx="26" fill="url(#wood)" stroke="#4f331d" stroke-width="4"/>
  <rect x="1010" y="586" width="480" height="10" fill="#c9a24a" opacity=".85"/>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" fill="#1e3a55" font-size="30" text-anchor="middle">
    <text x="1250" y="236">Flat marker</text>
  </g>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#f3ede4" font-size="30">
    <text x="1250" y="352" font-size="28">The vault, lined and sealed to resist water</text>
    <text x="1250" y="388" font-weight="600" font-size="24" fill="#d9cdbd">It carries the earth above, so the lawn stays level</text>
  </g>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#fff" font-size="28">
    <text x="1250" y="606">Casket</text>
  </g>
</svg>
