<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <!-- Card-sized (4:3) version of lawn-crypt-underground.svg: the lawn and marker on top, two concrete liners below. Stacked: confirmed by Martice 2026-11-16. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fbfd3"/><stop offset="1" stop-color="#dfeaf0"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d4330"/><stop offset="1" stop-color="#2f231a"/></linearGradient>
    <linearGradient id="conc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2dfd9"/><stop offset="1" stop-color="#b9b4ab"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9975a"/><stop offset="1" stop-color="#7d5527"/></linearGradient>
  </defs>
  <rect width="1200" height="230" fill="url(#sky)"/>
  <rect y="220" width="1200" height="680" fill="url(#soil)"/>
  <rect y="208" width="1200" height="30" fill="#6fa04a"/>
  <rect y="200" width="1200" height="12" fill="#86b864"/>
  <rect x="482" y="192" width="236" height="22" rx="3" fill="#8b8a85"/>
  <rect x="496" y="184" width="208" height="20" rx="2" fill="url(#bronze)"/>
  <g stroke="#8f8a82" stroke-width="6">
    <rect x="300" y="290" width="600" height="270" rx="14" fill="url(#conc)"/>
    <rect x="300" y="600" width="600" height="270" rx="14" fill="url(#conc)"/>
  </g>
  <g fill="#a39e95"><rect x="300" y="290" width="600" height="28" rx="12"/><rect x="300" y="600" width="600" height="28" rx="12"/></g>
  <g fill="none" stroke="#8a857c" stroke-width="4" stroke-dasharray="14 10"><rect x="350" y="345" width="500" height="175" rx="50"/><rect x="350" y="655" width="500" height="175" rx="50"/></g>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#4a463f" font-size="48">
    <text x="600" y="448">Concrete liner</text><text x="600" y="758">Concrete liner</text>
  </g>
</svg>
