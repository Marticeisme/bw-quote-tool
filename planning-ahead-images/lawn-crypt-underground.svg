<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <!-- What a lawn crypt is, underneath (Martice 2026-11-15: "build the underneath portion of what a lawn crypt is so the family
       understands; no photo I have will capture that"). The lawn and a flat bronze marker on top; two concrete liners already in
       the ground below (Burial Planning Guide: "Two concrete liners already in the ground in Garden 21, so no vault is needed").
       Stacked, one above the other: confirmed by Martice 2026-11-16. Sized 16:9 for the guide hero; the diagram sits right of the headline. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fbfd3"/><stop offset="1" stop-color="#dfeaf0"/></linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d4330"/><stop offset=".6" stop-color="#3d2c20"/><stop offset="1" stop-color="#2a1f17"/></linearGradient>
    <linearGradient id="conc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2dfd9"/><stop offset="1" stop-color="#b9b4ab"/></linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9975a"/><stop offset="1" stop-color="#7d5527"/></linearGradient>
  </defs>
  <rect width="1600" height="300" fill="url(#sky)"/>
  <g fill="#6f8f6a" opacity=".55"><ellipse cx="180" cy="270" rx="140" ry="70"/><ellipse cx="420" cy="262" rx="90" ry="60"/><ellipse cx="1500" cy="268" rx="130" ry="64"/></g>
  <rect y="290" width="1600" height="610" fill="url(#soil)"/>
  <g stroke="#6b4e38" stroke-width="2" opacity=".5" fill="none"><path d="M0 420 C 300 410, 600 432, 1600 414"/><path d="M0 560 C 400 548, 800 572, 1600 552"/><path d="M0 720 C 500 708, 900 730, 1600 712"/></g>
  <rect y="278" width="1600" height="30" fill="#6fa04a"/>
  <rect y="270" width="1600" height="12" fill="#86b864"/>
  <g fill="#5e8f3c"><path d="M60 272 l6 -16 l5 16Z"/><path d="M260 272 l5 -14 l5 14Z"/><path d="M520 272 l6 -17 l5 17Z"/><path d="M780 272 l5 -15 l5 15Z"/><path d="M1460 272 l6 -16 l5 16Z"/><path d="M1560 272 l5 -14 l5 14Z"/></g>
  <!-- the bronze marker, flat in the lawn -->
  <rect x="1132" y="262" width="236" height="22" rx="3" fill="#8b8a85"/>
  <rect x="1146" y="254" width="208" height="20" rx="2" fill="url(#bronze)"/>
  <!-- the two concrete liners, already in the ground -->
  <g stroke="#8f8a82" stroke-width="5">
    <rect x="1040" y="340" width="420" height="190" rx="12" fill="url(#conc)"/>
    <rect x="1040" y="560" width="420" height="190" rx="12" fill="url(#conc)"/>
  </g>
  <g fill="#a39e95"><rect x="1040" y="340" width="420" height="22" rx="10"/><rect x="1040" y="560" width="420" height="22" rx="10"/></g>
  <g fill="none" stroke="#8a857c" stroke-width="3" stroke-dasharray="12 9"><rect x="1080" y="384" width="340" height="118" rx="36"/><rect x="1080" y="604" width="340" height="118" rx="36"/></g>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" text-anchor="middle" fill="#4a463f">
    <text x="1250" y="455" font-size="34">Concrete liner</text><text x="1250" y="675" font-size="34">Concrete liner</text>
  </g>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-weight="700" fill="#1e3a55" font-size="30">
    <text x="1250" y="236" text-anchor="middle">Bronze marker</text>
  </g>
</svg>
