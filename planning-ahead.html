  'caskets':{side:'funeral', title:'Choosing a casket', img:IMG.casketRoom, kicker:'The casket',
    h:'Choosing a casket', s:'Wood or metal, simple or detailed. Seeing them in person helps more than any catalog.',
    deep:{k:'The kinds of caskets', h:'Three ways to start', lead:'Pick the material first. The style and the interior come after.',
      steps:[{img:IMG.woodCasket,h:'Wood',p:'Hardwoods and veneers. Many are also suitable for cremation.',contain:true},
             {img:IMG.metalCasket,h:'Metal',p:'Steel and other metals, in a range of finishes. For burial.',contain:true},
             {img:IMG.cremCasket,h:'Made for cremation',p:'Simpler caskets and containers, and rental caskets for a viewing before cremation.',contain:true}],
      faq:[{q:'Can we bring a casket from somewhere else?',a:"Yes. Federal law lets you supply your own, and we can't charge a fee for using it."},
           {q:'Does a sealed casket preserve the body?',a:"No. A gasket is a closure feature. No casket preserves a body, and we won't tell you one does."},
           {q:'What does the number on a steel casket mean?',a:"It's the gauge of the steel. A lower number means thicker steel."}],
      link:{href:'all-caskets.html', t:'Open the Casket Catalog'}}},
  'terramation':{side:'funeral', title:'Terramation', img:IMG.rhCeremony, kicker:'Terramation',
    h:'Terramation: returning to the earth', s:'A third choice, alongside burial and cremation. A person is gently transformed into soil, with nothing but straw, alfalfa, sawdust and air.',
    deep:{k:'How it works', h:'About two months, in two halves', lead:'We provide terramation through Return Home in Auburn, our preferred partner. You make the arrangements with us.',
      steps:[{img:IMG.tVisit,h:'In our care',p:'We bathe and dress your loved one here, in a compostable garment.'},
             {img:IMG.rhVessel,h:'The laying-in',p:'They are laid in the vessel on straw, alfalfa and sawdust, often with a ceremony.'},
             {img:IMG.tStraw,h:'About 30 days, then 30 more',p:'The body becomes soil, which is screened, tested and left to rest.'},
             {img:IMG.tSoil,h:'Soil comes home',p:'Soil you can plant in, scatter, or place here at the park.'}],
      faq:[{q:'Can the soil be placed at Washington Memorial Park?',a:"Yes, in a standard-size plot, so there's a permanent place with a name on it."},
           {q:'Where else can it go?',a:'Your own garden is yours to plant. Anywhere else, ask the owner or the agency first.'},
           {q:'Is the soil safe?',a:"Washington requires it to pass testing before it's released. People plant gardens and trees in it."}],
      link:{href:'terramation-guide.html', t:'Open the Terramation Guide'}}},
  'ground-burial':{side:'cemetery', title:'Ground burial', img:IMG.path, kicker:'Where you rest', map:'ground', vs:['ground-vs-mausoleum', 'estate-vs-ground', 'oc-other'],
    h:'A place in our gardens', s:'Each numbered garden has its own outlook. Most use flat markers, so the lawn stays open. A few areas allow upright monuments.',
    deep:{k:'What you own', h:'A right, not the land', lead:'You receive a Certificate of Interment Rights: the exclusive right to use one space as a resting place. The cemetery keeps and cares for the grounds.',
      steps:[{img:IMG.lawn,h:'One casket per space',p:'A couple who both choose burial need two spaces, side by side.'},
             {img:IMG.path,h:'A casket and an urn can share',p:'When one person chooses burial and the other cremation, both can rest in one space.'},
             {img:IMG.bigTree,h:'Cared for, permanently',p:'Part of every sale goes into the endowment care fund. Only its earnings are spent, so the grounds are kept for good.'}],
      faq:[{q:'Does the right ever expire?',a:"No. It doesn't expire, it isn't affected by moving away, and it passes to your family if it's never used."},
           {q:'Can more people be added later?',a:'Cremated remains can be added to a space that already holds someone. Each addition is its own right of interment, with its own opening and closing.'},
           {q:'What is a lawn crypt?',a:"A chamber already installed underground in a designated section, so the ground doesn't have to be opened the same way later. Available in limited areas."},
           {q:'Where can we put an upright monument?',a:'Only in a few areas of the park. Everywhere else uses flat markers.'}],
      link:{href:'cemetery-property-guide.html', t:'Open the Cemetery Property Guide'}}},
  'mausoleum':{side:'cemetery', title:'Mausoleums', img:IMG.mChapel, kicker:'Where you rest', map:'mausoleum', vs:['ground-vs-mausoleum', 'day-crypt', 'name-plates'],
    h:'Resting above ground', s:'A crypt in a mausoleum, for families who would rather not be in the ground. Indoors in the Chapel of Memories, or outdoors in a garden court.',
    deep:{k:'Our mausoleums', h:'Indoors or out', lead:'Entombment means the casket is placed in a crypt above ground. No outer burial container is needed.',
      steps:[{img:IMG.corridor,h:'Chapel of Memories',p:'Indoors, out of the weather, with its own small chapel inside.'},
             {img:IMG.stained,h:'Eternal Light Mausoleum',p:'Attached to the Chapel of Memories.'},
             {img:IMG.terracePool,h:'Terrace Garden Mausoleum',p:'Outdoor crypts around a fountain and reflecting pool.'},
             {img:IMG.gcmWall,h:'Garden Court Mausoleum',p:'Outdoor crypts in a row of garden courts, by the Veterans garden.'},
             {img:IMG.crypts,h:'The crypt front',p:'Engraved granite or bronze, with the name and dates.'}],
      faq:[{q:'Can two of us be together?',a:'Yes. There are single crypts and companion crypts for two.'},
           {q:'Do we choose the level?',a:'Yes. Crypts are stacked in tiers, so you choose the building, the wall and the level.'},
           {q:'Can we visit any time?',a:'The mausoleums are open whenever the park is, and the indoor ones let you visit out of the rain.'}],
      link:{href:'terrace-garden-guide.html', t:'Open the Terrace Garden guide'}}},
  'granite-niche':{side:'cemetery', title:'Granite-front niches', img:IMG.roac, kicker:'Where you rest', map:'granite', vs:['glass-vs-granite', 'niche-placing', 'name-plates'],
    h:'Granite-front niches', s:'Outdoors, in the open air. The urn rests behind a stone front, with the name and dates engraved into the granite.',
    deep:{k:'Three places to choose from', h:'Where the granite niches are', lead:'Two rights of interment come with the niche at all three, so two people share one.',
      steps:[{img:'granite-niche-images/roac-courtyard.jpg',h:'Rock of Ages Columbarium',p:'A granite courtyard under a timber pavilion: seven double-sided walls and two memorial benches.'},
             {img:'granite-niche-images/gomn-wall.jpg',h:'Garden of Meditation',p:'A stepped wall of polished black granite in a planted garden, sold as companion niches.'},
             {img:'granite-niche-images/tgn-niche-bank.jpg',h:'Terrace Garden',p:'Our newest: a black granite niche bank across the end of the Memorial Path.'}],
      faq:[{q:'How many people can share a niche?',a:'Two. Two rights of interment come with the niche at all three places.'},
           {q:'Can we put photos on it?',a:"The Garden of Meditation has a firm rule against photos. That's one real difference from a glass front, where photographs are the norm."},
           {q:'Does the urn have to be a certain size?',a:'At the Garden of Meditation, yes. The niche fits two Interlude Urns, which is why it holds two people.'},
           {q:'Glass or granite, which is better?',a:"Neither one is better. They're built for the same purpose and cared for the same way. The real choice is whether the urn and the keepsakes should be seen."}],
      link:{href:'granite-niches-guide.html', t:'Open the full Granite Niches guide'}}},
  'family-grave':{side:'cemetery', title:"Sharing a family grave", img:IMG.groundSpace, kicker:'Where you rest', vs:['urngarden-vs-plot', 'day-urn'],
    h:'Sharing a family grave', s:"A grave can hold the casket burial and up to two urns. It's one of the most common ways families stay together here.",
    deep:{k:'How it works', h:'More than one person in one grave', lead:"Each person placed in a grave is a right of interment. The first is usually the casket burial. Up to two more can be urns.",
      steps:[{n:1,h:'The first right',p:'Usually the casket burial of Mom or Dad.'},
             {n:2,h:'Up to two urns',p:"Each one is an added right in that same grave, Mom's or Dad's. Never between two graves."},
             {n:3,h:'What each one needs',p:'Its own opening and closing, its own recording, and usually an urn vault.'},
             {n:4,h:'The name',p:"Added to the marker that's already there, or on a new companion marker."}],
      faq:[{q:"Do we already own a right in that grave?",a:"Maybe. Families often bought one years ago and forgot. I check the records first, so you never pay twice."},
           {q:'Who can sign for it?',a:"Whoever holds the rights to that grave. If it's still in a parent's name, I'll check who can sign before anything is done."},
           {q:'Will any urn fit?',a:'Most do. Some urns are too large for a standard urn vault, so we check the size first.'},
           {q:'Can the urn go between Mom and Dad?',a:"No. An added right goes in one grave, Mom's or Dad's. If you'd rather have a space of your own nearby, I'll show you what's open on the map."}],
      link:{href:'urn-placement-guide.html', t:'Open the Urn Placement guide'}}},
  'urn-ground':{side:'cemetery', title:'An urn in the ground', img:IMG.lugFountains, kicker:'Where you rest', map:'urnground', vs:['urngarden-vs-plot', 'day-urn'],
    h:'An urn in the ground', s:'In a garden built for urns, marked the way any grave is. The spaces, the planting and the memorials are all scaled to an urn.',
    deep:{k:'Two urn gardens, and one more way', h:'Where an urn can be buried', lead:'Every urn placed in the ground goes into an urn vault, which supports the ground above it.',
      steps:[{img:IMG.lugFountains,h:'Lake Urn Garden',p:'On the lake shore at the south end of the park, with two fountains and magnolias above.'},
             {img:IMG.lugPosts,h:'Boulders and posts by the water',p:'The only place in the park with urns in boulders near the lake, and cremation posts.'},
             {img:IMG.lugMarkers,h:'Marked like any grave',p:'Bronze memorials along the walkway, each over an urn placed beneath it.'},
             {img:P+'urn-vault-underground.svg',h:'Under the lawn',p:'The urn vault supports the ground above it.'}],
      faq:[{q:'Is there another urn garden?',a:'Yes. The Rose Urn Garden, in the Garden of Flowers. Each space there carries two rights, so a couple shares one.'},
           {q:'Can an urn go in with family in a lawn space?',a:"Yes. An urn can share a space with a casket, or join one that's already used."},
           {q:'How many urns fit in one space?',a:"It depends on the garden. Rose Urn Garden spaces carry two rights, Lake Urn Garden ground spaces carry one. I'll confirm it on the exact space."},
           {q:'How is it marked?',a:'With a flat bronze or granite memorial, the same way a lawn space is.'}],
      link:{href:'urn-gardens-guide.html', t:'Open the Urn Gardens guide'}}},
  'scattering':{side:'cemetery', title:'Scattering gardens', img:IMG.ossuary, kicker:'Where you rest', map:'scatter',
    h:'Scattering, with a name kept', s:'The remains are scattered in a garden made for it, and a name goes on a memorial, so your family still has somewhere to visit.',
    deep:{k:'Three gardens', h:'Where scattering happens here', lead:"In all three, the cemetery keeps the garden and records the address. That's what scattering somewhere private can't give you.",
      steps:[{n:1,h:'Rose Scattering Garden',p:'In the Garden of Flowers, with a granite memorial plaque.'},
             {n:2,h:'Eternal Rest Scattering Garden',p:'By the entrance, with a bronze plaque.'},
             {n:3,h:'Terrace Garden Ossuary',p:'With the name engraved in granite on site.'}],
      faq:[{q:'Can the remains be taken back out later?',a:'No. Once scattered, they become part of the garden and can\'t be recovered. Some families keep a small portion in a keepsake urn first.'},
           {q:'Can we be there?',a:'Yes, and the gardens are open during park hours, any day you want to come back.'}],
      link:{href:'scattering-guide.html', t:'Open the Scattering Garden guide'}}},
  'keeping-home':{side:'cemetery', title:'Keeping the urn at home', img:IMG.urnHands, inset:true, kicker:'Where you rest',
    h:'Taken home by family', s:"It's allowed, and plenty of families start this way. The question worth answering now is where the urn goes after that.",
    deep:{k:'Worth deciding now', h:'What happens later', lead:"An urn at home is kept by one person. A plan says what happens when that person can't keep it any longer.",
      steps:[{n:1,h:'Who keeps it',p:'In Washington, the person with the right to decide is entitled to keep the remains.'},
             {n:2,h:'Scattering somewhere special',p:'Puget Sound, rivers and lakes are allowed; private land needs the owner\'s permission.'},
             {n:3,h:'A place here later',p:'A niche, an urn garden or a scattering garden can be chosen now and used whenever the family is ready.'}],
      faq:[{q:'Can we split the remains?',a:'Yes. Keepsake urns hold a small portion, so more than one person can keep some close.'}]}},
  'oc-other':{side:'cemetery', title:'Opening and closing', btn:'On the day', img:IMG.vaultLower, kicker:'Opening and closing',
    h:'Opening and closing', s:'The work of the day itself: preparing the space before the service, and closing it afterward. Our own cemetery staff do it.',
    deep:{k:'On the day', h:'What happens at the grave', lead:'The space is ready before anyone arrives.',
      steps:[{img:IMG.graveSetup,h:'Before the service',p:'The grave is opened and the vault is set, with a tent and seating in place.'},
             {img:IMG.vaultGrave,h:'Everyone gathers',p:'Family and friends gather under the tent, right at the grave.'},
             {img:IMG.vaultSigning,h:'A last goodbye',p:"Some families sign or decorate the vault lid before it's closed."},
             {img:IMG.vaultLower,h:'The lowering',p:'You can stay for the lowering, or leave before it.'},
             {img:IMG.groundSpace,h:'Help close the grave',p:'Your family can always help shovel some dirt, if you want to.'},
             {img:IMG.vaultLid,h:'Closing',p:'The vault is closed and the grave is filled after everyone has gone.'}],
      faq:[{q:'Is this the same as buying the space?',a:'No. The space is the property. Opening and closing is the work of the day, for each person placed.'},
           {q:'Does the day of the week matter?',a:'Yes. Weekends, holidays and later-afternoon times are handled differently, so if the day is flexible, tell me.'}]}},
  'vault':{side:'cemetery', title:'Burial vaults', img:P+'vault-underground.svg', kicker:'Vault',
    h:'The burial vault', s:"The cemetery asks for one so the ground doesn't settle into a dip. A vault is lined and sealed to resist water, and carries the weight of the earth above it.",
    deep:{k:'Three levels', h:'How vaults differ', lead:'All three are reinforced concrete. What changes is the reinforcement and the liner inside.',
      steps:[{n:1,h:'Basic',p:'Single-reinforced concrete with a high-impact plastic liner.'},
             {n:2,h:'Standard',p:'Double-reinforced concrete with a stainless steel liner.'},
             {n:3,h:'Premium',p:'Double- or triple-reinforced, with a bronze or copper liner.'}],
      faq:[{q:'Is a vault required by law?',a:'No state law requires one. The cemetery requires an outer burial container so the ground stays level and safe to mow.'},
           {q:'Can the lid be personalized?',a:'Yes. Lids can carry a name, an emblem or a design, and families sometimes sign them at the graveside.'},
           {q:'What about an urn?',a:'An urn in the ground goes into an urn vault for the same reason.'}],
      link:{href:'vault-guide.html', t:'Open the Vault presentation'}}},
  'markers':{side:'cemetery', title:'Markers and monuments', img:IMG.graniteMarker, inset:true, portrait:false, kicker:'Memorial', map:'ground', vs:['flat-vs-upright', 'marker-sizes'],
    h:'The marker', s:"It's what your family comes back to. Most of the park uses flat markers, in granite or bronze, for one person or for two.",
    deep:{k:'The choices', h:'Granite or bronze, flat or upright', lead:"Both last. Granite is what most families choose here, because there's more you can do with it.",
      steps:[{img:IMG.graniteMarker,h:'Flat granite',p:'Solid stone in many colors. Comes with the standard engraving and setting it.'},
             {img:IMG.bronze,h:'Flat bronze',p:'Cast bronze. Comes with the granite or concrete base it sits on, and installing it.',fit:true},
             {img:IMG.graniteComp,h:'Companion',p:'One marker shared by two people, with room for both names.',fit:true},
             {img:IMG.upright,h:'Upright monuments',p:'Allowed only in a few areas of the park.'},
             {img:IMG.bench,h:'A memorial bench',p:'In Sections 6 and 23, select areas of Section 20, and family estates.'}],
      faq:[{q:'Can a photo go on it?',a:'Yes. Ceramic photo portraits and etched images are both possible on granite.'},
           {q:'What about a veteran\'s marker?',a:'The VA provides one. A bronze government marker sits on a granite base, and a spouse can often be matched beside it.'},
           {q:'Can we buy a marker somewhere else?',a:'Yes, as long as it meets the cemetery\'s marker rules. I can walk you through them.'}],
      link:{href:'markers-guide.html', t:'Open the Granite Marker Guide'}}},
};

/* MARKER SIZES, TO SCALE: outlines at true relative size on our lawn. Sizes from markers-guide.html and
   bronze-markers-guide.html (inches, width x height; bronze shown on the base it has to sit on). No prices. */
const SIZES = {
  granite:[{w:28, h:16, t:'Single'}, {w:32, h:20, t:'Single'}, {w:28, h:34, t:'Single or companion'}, {w:44, h:20, t:'Companion, two graves'}, {w:60, h:20, t:'Companion, two graves'}],
  bronze:[{w:24, h:12, bw:28, bh:16, t:'Government bronze'}, {w:24, h:14, bw:28, bh:18, t:'Single'}, {w:28, h:16, bw:32, bh:20, t:'Single'}, {w:44, h:14, bw:48, bh:18, t:'Companion, two graves'}, {w:56, h:16, bw:64, bh:20, t:'Companion, two graves'}]
};
function sizesSVG() {
  const S = 5.2, gap = 48, W = 1700;
  const row = (list, y, kind) => {
    let x = 40, out = '';
    list.forEach(m => {
      const ow = (m.bw || m.w) * S, oh = (m.bh || m.h) * S;
      if (kind === 'bronze') {
        out += `<rect x="${x}" y="${y}" width="${ow}" height="${oh}" rx="3" fill="#8f8c86" stroke="#d8d4cc" stroke-width="2"/>`;
        out += `<rect x="${x + (ow - m.w * S) / 2}" y="${y + (oh - m.h * S) / 2}" width="${m.w * S}" height="${m.h * S}" rx="2" fill="#a8763e" stroke="#e2b77b" stroke-width="2"/>`;
      } else out += `<rect x="${x}" y="${y}" width="${ow}" height="${oh}" rx="3" fill="#4f5358" stroke="#c9ccd0" stroke-width="2"/>`;
      out += `<text x="${x + ow / 2}" y="${y + oh + 34}" text-anchor="middle" font-size="26" font-weight="700" fill="#fff">${m.w}" × ${m.h}"</text>`;
      out += `<text x="${x + ow / 2}" y="${y + oh + 60}" text-anchor="middle" font-size="19" fill="rgba(255,255,255,.78)">${esc(m.t)}</text>`;
      if (m.bw) out += `<text x="${x + ow / 2}" y="${y + oh + 84}" text-anchor="middle" font-size="17" fill="rgba(255,255,255,.6)">on a ${m.bw}" × ${m.bh}" base</text>`;
      x += ow + gap;
    });
    return out;
  };
  return `<svg class="sizes" viewBox="0 0 ${W} 640" role="img" aria-label="Marker sizes drawn to scale"><g font-family="Source Sans 3, Segoe UI, sans-serif">
    <text x="40" y="36" font-size="24" font-weight="800" letter-spacing="4" fill="#f08a5d">GRANITE</text>${row(SIZES.granite, 60, 'granite')}
    <text x="40" y="384" font-size="24" font-weight="800" letter-spacing="4" fill="#f08a5d">BRONZE, ON ITS BASE</text>${row(SIZES.bronze, 408, 'bronze')}</g></svg>`;
}
function sizesHTML() {
  return `<div class="bg" style="${bg(IMG.lawn)}"></div><div class="shade full"></div>
   <div class="sizes-wrap"><div class="kicker">Memorial</div><h1 class="headline">Marker sizes, to scale</h1>
   <p class="sub">Every size here is drawn at the same scale, so you can see how they compare on the lawn.</p>
   ${sizesSVG()}
   <p class="sizes-note">Full ledgers (36" × 72" granite, 32" × 72" bronze) are six feet long, too long to draw at this scale. The Lake Urn Garden uses 15" × 10" singles.</p></div>`;
}

const INTRO = ['why-ahead', 'why-1868'];
function toggle(qid, v) {

  } else if (qById(qid) && qById(qid).multi) {

    A[qid] = cur.includes(v) ? cur.filter(x => x !== v) : [...cur, v];
  } else A[qid] = A[qid] === v ? undefined : v;

}

function openSlice(id) {

function openGuide(id, pos) {

  });
  el.querySelectorAll('[data-ans]').forEach(b => b.addEventListener('click', () => { toggle(cur.id, b.dataset.ans); refreshQuestion(); }));
  el.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { const m = b.dataset.mode; A.mode = m === 'both' ? 'both' : +m; refreshQuestion(); }));
  el.querySelectorAll('[data-name]').forEach(inp => { inp.addEventListener('input', () => { A.names[+inp.dataset.name] = inp.value.slice(0, 30); }); inp.addEventListener('keydown', e => e.stopPropagation()); });

  el.querySelectorAll('[data-pname]').forEach(inp => { inp.addEventListener('input', () => { A.party[inp.dataset.pname].name = inp.value.slice(0, 30); const n = inp.closest('.party') && inp.closest('.party').querySelector('.party-note'); if (n) n.textContent = partyPreview(); }); inp.addEventListener('keydown', e => e.stopPropagation()); });
  el.querySelectorAll('[data-mark]').forEach(b => b.addEventListener('click', e => {

  el.querySelectorAll('[data-slice]').forEach(b => b.addEventListener('click', () => openSlice(b.dataset.slice)));
  el.querySelectorAll('[data-guide]').forEach(b => b.addEventListener('click', () => openGuide(b.dataset.guide, b.dataset.pos)));

  el.querySelectorAll('[data-before]').forEach(b => b.addEventListener('click', () => pickBefore(b.dataset.before)));
  el.querySelectorAll('[data-add]').forEach(b => b.addEventListener('click', () => { addToPlan(b.dataset.add); show({...cur}, false); }));

}
function go(what) {
  if (what === 'begin') return show({t:'track'});

  if (what === 'skipwhy') return show({t:'wheelintro'});
  if (what === 'introNext') { const i = (cur.i || 0) + 1; return i < INTRO.length ? show({t:'intro', id:INTRO[i], i}) : startTrack(); }
  if (what === 'startQs') return show({t:'q', id:askable()[0].id});
  if (what === 'resumeQs') return resumeQuestions();
  const placesNow = () => [...new Set(people().flatMap(i => selP('place', i)))];
  const narrowAfter = then => { const keep = placesNow(); if (keep.length < 2) return false; show({t:'q', id:'place', narrow:true, keep, then}); return true; };
  if (what === 'qNext' && cur.t === 'q' && cur.id === 'tour' && narrowAfter('next')) return;
  if (what === 'tourBack') { if (narrowAfter('bridge')) return; return back(); }
  if (what === 'qNext' && cur.narrow) what = 'narrowDone';
  if (what === 'narrowDone') { if (cur.then === 'bridge') return show({t:'q', id:'bridge'}); return show({t:'yours'}); }   // the tour is always the last step
  if (what === 'qNext' && cur.id === 'who' && A.who === 'several') startParty();
  if (what === 'qNext' && cur.id === 'parents' && A.parents === 'p-more') QUEUE = [{ask:true, label:'Your own plan'}];
  if (what === 'nextPlan') return nextPlan();
  if (what === 'tourNow') { A.toured = true; return show({t:'tournow'}); }
  if (what === 'qNext') { const nx = nextFrom(cur.id); return nx ? show({t:'q', id:nx.id}) : show({t:'yours'}); }
  if (what === 'backOut') return back();
  if (what === 'wheel') return show({t:'wheel'});
  if (what === 'yours') return show({t:'yours'});
  if (what === 'park') return show({t:'map', focus:'all'});
  // New to all this: each guide on the walk-through opens with "How it works" showing.
  const deepFor = id => A.before === 'no' && !!(GUIDES[id] && GUIDES[id].deep);
  if (what === 'pathStart') { const p = path(); return p.length ? show({t:'guide', id:p[0], pos:0, deep:deepFor(p[0])}) : show({t:'wheel'}); }
  if (what === 'pathNext') { const p = path(); const i = (cur.pos || 0) + 1; return i < p.length ? show({t:'guide', id:p[i], pos:i, deep:deepFor(p[i])}) : show({t:'close'}); }

  if (what === 'shallow') { cur.deep = false; stage.querySelector('.screen.on')?.classList.remove('deep'); return; }
}
