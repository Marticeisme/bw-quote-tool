<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planning Ahead · Bonney Watson</title>
<!-- Planning Ahead: the in-person, on-screen presentation for pre-need appointments.
     Funeral side and cemetery side. No prices, no PDF, nothing saved: answers live only for
     the visit. Design: docs/superpowers/specs/2026-11-11-planning-ahead-presentation-design.md
     Questions, wheel slices and guides are DATA (QUESTIONS, SLICES, GUIDES below): add an
     entry to grow it, don't hand-build screens. Copy rules: no em dashes, vaults "resist
     water" (16 CFR 453.3(e)(2)), no prices. -->
<style>
@font-face{font-family:'Cormorant Garamond';src:url(fonts/CormorantGaramond-500.woff) format('woff');font-weight:500;font-display:swap;}
@font-face{font-family:'Cormorant Garamond';src:url(fonts/CormorantGaramond-600.woff) format('woff');font-weight:600;font-display:swap;}
@font-face{font-family:'Cormorant Garamond';src:url(fonts/CormorantGaramond-700.woff) format('woff');font-weight:700;font-display:swap;}
@font-face{font-family:'Cormorant Garamond';src:url(fonts/CormorantGaramond-500i.woff) format('woff');font-weight:500;font-style:italic;font-display:swap;}
@font-face{font-family:'Source Sans 3';src:url(fonts/SourceSans3-400.woff) format('woff');font-weight:400;font-display:swap;}
@font-face{font-family:'Source Sans 3';src:url(fonts/SourceSans3-600.woff) format('woff');font-weight:600;font-display:swap;}
@font-face{font-family:'Source Sans 3';src:url(fonts/SourceSans3-700.woff) format('woff');font-weight:700;font-display:swap;}
:root{
  --navy:#466e86; --navy-dark:#33505f; --navy-deep:#1e3a55; --ink:#0f1d29;
  --orange:#e84610; --orange-soft:#f08a5d; --cream:#f8f6f2; --rule:#ddd6c8;
  --text:#2a3442; --muted:#6b7a89;
  --fs-hero:clamp(34px,4.6vw,84px); --fs-q:clamp(26px,3.2vw,56px); --fs-sub:clamp(16px,1.55vw,28px);
  --fs-card:clamp(15px,1.35vw,24px); --fs-body:clamp(15px,1.2vw,21px);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{background:var(--ink);color:#fff;font-family:'Source Sans 3',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
.serif{font-family:'Cormorant Garamond',Georgia,serif;}

/* ── chrome ── */
#chrome{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;gap:10px;padding:14px 22px;
  background:linear-gradient(180deg,rgba(10,20,30,.72),rgba(10,20,30,0));pointer-events:none;}
#chrome>*{pointer-events:auto;}
#chrome .logo{height:clamp(38px,2.7vw,56px);opacity:1;cursor:pointer;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35));}
#chrome .where{margin-left:22px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.7);font-weight:600;}
#chrome .sp{flex:1;}
.cbtn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:rgba(15,29,41,.55);
  border:1px solid rgba(255,255,255,.22);font-size:14px;font-weight:600;letter-spacing:.02em;backdrop-filter:blur(6px);transition:background .15s;}
.cbtn:hover{background:rgba(70,110,134,.75);}
.cbtn svg{width:20px;height:20px;}
.cbtn[hidden]{display:none;}

/* ── screens ── */
#stage{position:fixed;inset:0;}
.screen{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;pointer-events:none;}
.screen.on{opacity:1;pointer-events:auto;}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);transition:transform 8s ease;}
.screen.on .bg{transform:scale(1);}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,16,24,.82) 0%,rgba(8,16,24,.45) 48%,rgba(8,16,24,.05) 100%);}
.shade.bottom{background:linear-gradient(0deg,rgba(8,16,24,.88) 0%,rgba(8,16,24,.35) 45%,rgba(8,16,24,0) 75%);}
.copy{position:absolute;left:7vw;bottom:15vh;max-width:min(62vw,1100px);}
.kicker{font-size:clamp(12px,.95vw,16px);font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--orange-soft);margin-bottom:1.2vh;}
.headline{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:var(--fs-hero);line-height:1.05;letter-spacing:-.005em;text-shadow:0 2px 24px rgba(0,0,0,.35);}
.sub{margin-top:2.2vh;font-size:var(--fs-sub);line-height:1.45;color:rgba(255,255,255,.88);max-width:46em;}
.cite{margin-top:1.6vh;font-size:13px;color:rgba(255,255,255,.55);letter-spacing:.04em;}
.actions{display:flex;gap:14px;margin-top:4vh;flex-wrap:wrap;}
.btn{padding:14px 26px;border-radius:999px;font-size:clamp(15px,1.15vw,20px);font-weight:700;letter-spacing:.02em;transition:transform .15s,background .15s;}
.btn:hover{transform:translateY(-1px);}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 6px 24px rgba(232,70,16,.35);}
.btn.primary:hover{background:#ff5a22;}
.btn.armed{background:#c23a0d !important;border-color:#c23a0d !important;color:#fff !important;}
.btn.ghost{border:1.5px solid rgba(255,255,255,.55);color:#fff;background:rgba(255,255,255,.06);}
.btn.ghost:hover{background:rgba(255,255,255,.16);}
/* On-screen Back beside Next (Martice 11-25: going backwards shouldn't need the keyboard) */
.btn.back{display:inline-flex;align-items:center;gap:6px;padding-left:18px;}
.btn.back svg{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;}
.inset-photo{position:absolute;right:7vw;top:50%;transform:translateY(-50%);width:34vw;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);border:8px solid #fff;}
.inset-photo.tall{width:auto;height:72vh;max-width:34vw;object-fit:cover;}
.globe{position:absolute;right:6vw;top:50%;transform:translateY(-50%);width:min(40vw,70vh);opacity:.9;}

/* ── question ── */
.qwrap{position:absolute;inset:0;display:flex;flex-direction:column;padding:11vh 6vw 9vh;background:radial-gradient(ellipse at 50% 0%,#24435d 0%,var(--ink) 70%);}
.qtitle{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:var(--fs-q);line-height:1.1;text-align:center;}
.qsub{text-align:center;font-size:var(--fs-sub);color:rgba(255,255,255,.72);margin-top:1.2vh;}
.cards{flex:1;display:grid;gap:1.6vw;margin-top:3.5vh;margin-bottom:2vh;align-content:center;justify-content:center;}
.card{position:relative;border-radius:14px;overflow:hidden;background:#162a3a;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.35);
  transition:transform .18s,box-shadow .18s,outline-color .18s;outline:3px solid transparent;outline-offset:3px;display:flex;flex-direction:column;}
.card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 18px 44px rgba(0,0,0,.5);}
.card.picked{outline-color:var(--orange);}
.card .ph{aspect-ratio:4/3;background-size:cover;background-position:center;}
.card .lab{padding:1.4vh 1.2vw 1.8vh;}
.card .lab b{display:block;font-size:var(--fs-card);font-weight:700;line-height:1.2;}
.card .lab span{display:block;margin-top:.5vh;font-size:clamp(13px,1vw,17px);color:rgba(255,255,255,.7);line-height:1.35;}
/* Not sure yet: a card like the others, with a question-mark icon (Martice 11-21) */
.card.unsure .ph svg .dot{fill:#f0703f;stroke:none;}
.card.ico .ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(150deg,#3d6680,#1e3a55);}
.card.ico .ph svg{width:34%;height:auto;max-height:62%;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
.card.ico .ph svg .o{stroke:#f0703f;}
.card.big .ph{display:flex;align-items:center;justify-content:center;font-family:'Source Sans 3',sans-serif;font-size:clamp(70px,9vw,170px);font-weight:600;color:#fff;
  background:linear-gradient(135deg,var(--navy),var(--navy-deep));}
.card .tick{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:var(--orange);display:none;align-items:center;justify-content:center;font-weight:800;}
.card.picked .tick{display:flex;}
.qdots{position:absolute;left:0;right:0;bottom:2.4vh;display:flex;justify-content:center;gap:10px;}
.qdots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:transform .15s;outline-offset:4px;}
.qdots i:hover{transform:scale(1.5);}
.qdots i.done{background:var(--navy);} .qdots i.now{background:var(--orange);transform:scale(1.25);}

/* ── compare ── */
.cmp{position:absolute;inset:0;padding:11vh 5vw 6vh;display:flex;flex-direction:column;background:var(--ink);}
.cmp-grid{flex:1;display:grid;gap:1.6vw;margin-top:3.5vh;}
.cmp-col{background:#132636;border-radius:14px;overflow:hidden;display:flex;flex-direction:column;}
.cmp-col .ph{height:26vh;background-size:cover;background-position:center 60%;}
.cmp-col h3{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,2.2vw,40px);font-weight:600;padding:1.6vh 1.4vw .6vh;}
.cmp-col dl{padding:0 1.4vw 1.6vh;}
.cmp-col dt{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange-soft);font-weight:700;margin-top:1.4vh;}
.cmp-col dd{font-size:var(--fs-body);line-height:1.4;color:rgba(255,255,255,.88);margin-top:.4vh;}
.cmp-col .pick{margin:auto 1.4vw 1.8vh;}

/* ── guide layers ── */
.deeper{position:absolute;left:0;right:0;bottom:0;height:84vh;background:var(--cream);color:var(--text);border-radius:22px 22px 0 0;
  transform:translateY(102%);transition:transform .5s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:5vh 6vw 8vh;box-shadow:0 -20px 60px rgba(0,0,0,.45);}
.screen.deep .deeper{transform:none;}
.deeper .dk{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:700;}
.deeper h2{font-family:'Cormorant Garamond',serif;font-size:clamp(28px,2.8vw,52px);font-weight:600;color:var(--navy-deep);line-height:1.1;margin-top:.6vh;}
.deeper .lead{font-size:var(--fs-sub);line-height:1.5;margin-top:1.4vh;max-width:52em;color:#3a4453;}
.steps{display:grid;gap:1.6vw;margin-top:3.5vh;}
.step{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(30,58,85,.1);display:flex;flex-direction:column;}
.step .ph{aspect-ratio:3/2;background-size:cover;background-position:center;background-color:#e9eef2;}
.step .n{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:17px;}
.step .tx{padding:1.6vh 1.2vw 2vh;}
.step h4{font-size:var(--fs-card);color:var(--navy-deep);margin-top:1vh;line-height:1.25;}
.step p{font-size:var(--fs-body);line-height:1.45;margin-top:.6vh;color:#3a4453;}
.faq{margin-top:5vh;max-width:70em;}
.faq h3{font-family:'Cormorant Garamond',serif;font-size:clamp(24px,2vw,36px);color:var(--navy-deep);font-weight:600;margin-bottom:1vh;}
.faq details{border-top:1px solid var(--rule);padding:1.6vh 0;}
.faq summary{font-size:var(--fs-card);font-weight:600;color:var(--navy-deep);cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:20px;}
.faq summary::after{content:'+';color:var(--orange);font-size:1.3em;line-height:1;}
.faq details[open] summary::after{content:'\2013';}
.faq details p{font-size:var(--fs-body);line-height:1.55;margin-top:1vh;color:#3a4453;max-width:56em;}
.close-deeper{position:sticky;top:0;float:right;margin:-2vh -3vw 0 0;width:46px;height:46px;border-radius:50%;background:var(--navy-deep);color:#fff;font-size:22px;}
.ext{display:inline-block;margin-top:3vh;font-weight:700;color:var(--navy);text-decoration:none;border-bottom:2px solid var(--orange);font-size:var(--fs-body);}
.guide-bar{position:absolute;right:5vw;bottom:5vh;display:flex;gap:12px;}
.gcount{position:absolute;left:7vw;bottom:6.2vh;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600;}
.soon{display:inline-block;margin-top:2vh;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.14);font-size:14px;font-weight:600;letter-spacing:.06em;}

/* ── wheel ── */
.wheelwrap{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:center;gap:4vw;padding:10vh 6vw 6vh;
  background:radial-gradient(ellipse at 30% 50%,#20405a 0%,var(--ink) 70%);}
.wheel{width:min(44vw,76vh);height:auto;justify-self:center;overflow:visible;}
.wheel .sl{cursor:pointer;transition:filter .2s,opacity .2s;}
.wheel .sl:hover{filter:brightness(1.18);}
.wheel text{pointer-events:none;font-family:'Source Sans 3',sans-serif;}
.wlist h2{font-family:'Cormorant Garamond',serif;font-size:var(--fs-q);font-weight:600;line-height:1.1;}
.wlist p.s{font-size:var(--fs-sub);color:rgba(255,255,255,.75);margin-top:1.2vh;line-height:1.45;}
.wrows{margin-top:2.4vh;display:grid;gap:.9vh;max-height:52vh;overflow:auto;padding-right:6px;}
.wrow{display:grid;grid-template-columns:14px 1fr auto;gap:14px;align-items:center;padding:1.1vh 1vw;border-radius:10px;background:rgba(255,255,255,.05);text-align:left;}
.wrow:hover{background:rgba(255,255,255,.12);}
.wrow i{width:14px;height:14px;border-radius:50%;}
.wrow .wl{display:flex;flex-direction:column;gap:2px;min-width:0;}
.wrow .wl small{font-size:clamp(12px,.8vw,15px);color:rgba(255,255,255,.6);font-weight:400;line-height:1.3;}
.trads{margin-top:1.6vh;display:grid;gap:1.4vh;}
.trads.two{grid-template-columns:1fr 1fr;gap:1.4vw;}
.trow .rwho{margin-bottom:.8vh;}
.tts{display:flex;flex-wrap:wrap;gap:1.2vw;}
.tt{display:flex;width:clamp(320px,28vw,560px);border-radius:14px;overflow:hidden;background:#fff;color:var(--ink);text-align:left;box-shadow:0 10px 28px rgba(0,0,0,.4);transition:transform .15s;}
.tt:hover{transform:translateY(-3px);}
.tt .ph{width:42%;flex:none;min-height:16vh;background-size:cover;background-position:center;position:relative;}
.tt .tx{padding:1.4vh 1.1vw;display:flex;flex-direction:column;gap:.5vh;}
.tt small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#c23a0d;}
.tt b{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,1.7vw,32px);font-weight:600;line-height:1.1;}
.tt span{font-size:clamp(13px,.95vw,17px);line-height:1.4;color:#33505f;}
.plain{margin-top:1.6vh;display:grid;gap:1.4vw;}
.plain.two{grid-template-columns:1fr 1fr;}
.plain .pw{background:rgba(255,255,255,.06);border-left:4px solid var(--orange);border-radius:10px;padding:1.6vh 1.4vw;}
.plain .pw h4{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,1.8vw,34px);font-weight:600;margin-bottom:.6vh;}
.plain .pw p{font-size:var(--fs-body);line-height:1.5;color:rgba(255,255,255,.9);margin-top:.5vh;}
.plain .pw p b{color:var(--orange-soft);font-weight:700;}
.wrow b{font-size:var(--fs-card);font-weight:600;}
.wrow span{font-size:clamp(12px,.9vw,16px);line-height:1.35;color:rgba(255,255,255,.75);text-align:right;}
.wrow.na span{color:rgba(255,255,255,.45);font-style:italic;}
.legend{display:flex;gap:22px;margin-top:2.4vh;font-size:14px;color:rgba(255,255,255,.7);}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:7px;vertical-align:-1px;}

/* ── your guide / library ── */
.listwrap{position:absolute;inset:0;padding:11vh 6vw 6vh;overflow:auto;background:var(--ink);}
.listwrap h2{font-family:'Cormorant Garamond',serif;font-size:var(--fs-q);font-weight:600;}
.listwrap .s{font-size:var(--fs-sub);color:rgba(255,255,255,.72);margin-top:1vh;}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,40vw),1fr));gap:1.4vw;margin-top:3.5vh;}
.tile{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;text-align:left;box-shadow:0 8px 26px rgba(0,0,0,.35);transition:transform .15s;}
.tile:hover{transform:translateY(-3px);}
.tile .ph{position:absolute;inset:0;background-size:cover;background-position:center;}
.tile .lab{position:absolute;left:0;right:0;bottom:0;padding:5vh 1.1vw 1.4vh;background:linear-gradient(0deg,rgba(8,16,24,.92),rgba(8,16,24,0));}
.tile .lab small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--orange-soft);}
.tile .lab b{display:block;font-size:var(--fs-card);line-height:1.2;margin-top:.4vh;}
.tile .num{position:absolute;top:10px;left:10px;width:34px;height:34px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:800;}
.tile .tag{position:absolute;top:10px;right:10px;padding:4px 10px;border-radius:999px;background:rgba(15,29,41,.75);font-size:12px;font-weight:600;}
.libsec{margin-top:4.5vh;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--orange-soft);}
.libsec + .tiles{margin-top:1.6vh;}


/* highlight-then-Next (2026-11-11): tapping a card only highlights it */
.qbar{position:absolute;right:5vw;bottom:5.5vh;display:flex;align-items:center;gap:14px;}
.qcount{font-size:clamp(14px,1.05vw,18px);color:rgba(255,255,255,.7);font-weight:600;margin-right:6px;}
.card .look{display:inline-block;margin-top:1vh;padding:5px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.35);font-size:clamp(12px,.9vw,15px);font-weight:700;color:#fff;}
.card .look:hover{background:rgba(255,255,255,.16);}
.card .ctag{position:absolute;top:10px;left:10px;padding:4px 10px;border-radius:999px;background:rgba(15,29,41,.8);font-size:12px;font-weight:700;letter-spacing:.06em;}
.card.picked{outline-color:var(--orange);background:#1d3448;}
.card.picked .ph{filter:saturate(1.08);}
.cmp-col.picked{outline:3px solid var(--orange);outline-offset:-3px;}
.pairs{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:2.2vh;}
.pairs span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--orange-soft);margin-right:6px;}
.pairs button{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font:inherit;font-size:clamp(14px,1vw,18px);font-weight:700;cursor:pointer;}
.cmp .qbar{position:static;justify-content:center;margin-top:2.4vh;}
.nat{color:rgba(255,255,255,.55);font-style:italic;text-transform:none;letter-spacing:.02em;font-weight:600;}
.qwrap{padding-bottom:6vh;}
.qwrap .qbar{position:static;justify-content:flex-end;margin-top:1.2vh;}
.qwrap .cards{flex:1 1 auto;min-height:0;}

.cmp{overflow:auto;}
.cmp.many .cmp-col .ph{height:15vh;}
.cmp.long .cmp-col .ph{height:17vh;}
.cmp.longer .cmp-col .ph{height:10vh;}
.cmp.long .cmp-col h3{padding:1.2vh 1.4vw .2vh;}
.cmp.long .cmp-col dt{margin-top:1vh;}
.cmp.longer .cmp-col dt{margin-top:.6vh;font-size:11px;}
.cmp.longer .cmp-col dd{font-size:clamp(13px,.92vw,17px);line-height:1.3;margin-top:.15vh;}
.cmp.longer .cmp-col .pick{margin-top:1vh;}
.cmp.long .cmp-grid{margin-top:2.4vh;}
.cmp.many .cmp-col h3{font-size:clamp(19px,1.55vw,30px);line-height:1.15;padding:1.2vh 1vw .3vh;}
.cmp.many .cmp-col dl{padding:0 1vw 1vh;}
.cmp.many .cmp-col dt{margin-top:1vh;font-size:11px;}
.cmp.many .cmp-col dd{font-size:clamp(13px,1vw,17px);}
.cmp.many .cmp-col .pick{margin:auto 1vw 1.4vh;padding:10px 14px;font-size:clamp(13px,.95vw,16px);}
.cmp.many .cmp-grid{gap:1vw;margin-top:2.4vh;}
.cards.dense .card .ph{aspect-ratio:16/9;}
.cards.dense .card .lab{padding:1vh .9vw 1.2vh;}
.cards.dense .card .lab b{font-size:clamp(13px,1vw,18px);}
.cards.dense .card .lab span{font-size:clamp(12px,.82vw,15px);margin-top:.3vh;}
.cards.dense .card .look{margin-top:.7vh;padding:3px 10px;font-size:12px;}
.cards.dense{gap:1.1vw;}

/* couple mode, product photos, park map (2026-11-12) */
.modes{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:1.6vh;}
.modes span{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:700;margin-right:6px;}
.mode{padding:8px 18px;border-radius:999px;border:1.5px solid rgba(255,255,255,.3);font-weight:700;font-size:clamp(13px,1vw,17px);}
.mode.on{background:#fff;color:var(--ink);border-color:#fff;}
.names{display:flex;justify-content:center;gap:2vw;margin-top:1.6vh;}
.names label{display:flex;flex-direction:column;gap:6px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.7);}
.names input{font:inherit;font-size:clamp(16px,1.3vw,22px);letter-spacing:0;text-transform:none;font-weight:600;padding:10px 14px;border-radius:10px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;width:min(22vw,320px);}
.who{position:absolute;bottom:auto;top:10px;right:52px;display:flex;gap:4px;z-index:2;}
.tile .who{top:auto;bottom:10px;right:10px;}
.who i{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;border:2px solid #fff;}
.who i.p0{background:var(--orange);} .who i.p1{background:var(--navy);}
.card.partial{outline-color:rgba(232,70,16,.5);outline-style:dashed;}
.ph.contain{background-size:contain !important;background-repeat:no-repeat;background-color:#fff !important;}
.step .ph.contain{background-color:#fff;}
.mapwrap{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:3vw;align-items:center;padding:10vh 4vw 6vh;background:radial-gradient(ellipse at 30% 50%,#20405a 0%,var(--ink) 70%);}
.mapbox{border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.45);background:#2c3a2a;aspect-ratio:1520/720;}
.mapwrap.wide{grid-template-columns:1fr;align-content:center;gap:2.4vh;padding-top:9vh;}
.mapwrap.wide .mapbox{aspect-ratio:2790/920;}
.mapwrap.wide .wlist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.2fr);gap:2vw;align-items:start;}
.mapwrap.wide .wlist h2{font-size:clamp(26px,2.4vw,44px);}
.mapwrap.wide .mrows{grid-template-columns:repeat(3,minmax(0,1fr));max-height:none;margin-top:0;}
.mapwrap.wide .mrow b{font-size:clamp(13px,1vw,18px);}
.mapbox .parkmap{width:100%;height:100%;}
.parkmap{display:block;width:100%;height:auto;}
.parkmap .mlab{font-family:'Source Sans 3',sans-serif;font-size:13px;font-weight:700;fill:#33505f;letter-spacing:.02em;}
.parkmap .mlab.on{fill:#9c2f0b;font-size:15px;}
.parkmap .mroad{font-family:'Source Sans 3',sans-serif;font-size:15px;font-weight:700;fill:#8c8270;letter-spacing:.18em;text-transform:uppercase;text-anchor:middle;}
.parkmap .pnum{font-family:'Source Sans 3',sans-serif;font-size:16px;font-weight:800;fill:#fff;pointer-events:none;}
.parkmap .glab{font-family:'Source Sans 3',sans-serif;font-weight:800;fill:#fff;paint-order:stroke;stroke:rgba(15,29,41,.85);stroke-width:5px;stroke-linejoin:round;letter-spacing:.02em;}
.parkmap .credit{font-family:'Source Sans 3',sans-serif;font-weight:600;fill:#fff;opacity:.75;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:3px;}
.parkmap .fpin circle{fill:#fff;stroke:#e84610;}
.parkmap .fnum{font-family:'Source Sans 3',sans-serif;font-weight:800;fill:#e84610;pointer-events:none;}
.pinpick .parkmap{cursor:crosshair;}
.prow{display:flex;align-items:center;gap:10px;margin-top:1.2vh;}
.prow .pn{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #e84610;color:#e84610;display:grid;place-items:center;font-weight:800;flex:none;}
.prow input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;font:inherit;font-size:clamp(15px,1.05vw,19px);}
.prow button{background:none;border:0;color:rgba(255,255,255,.7);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;}
.todo{margin-top:1.4vh;display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;}
.todo li{padding:8px 16px;border-radius:999px;background:rgba(232,70,16,.16);border:1px solid rgba(232,70,16,.55);font-size:clamp(14px,1.05vw,19px);font-weight:700;}
.gwith{margin-top:2.2vh;display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.gwith span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--orange-soft);margin-right:6px;}
.gwith button{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;font:inherit;font-size:clamp(14px,1vw,18px);font-weight:700;cursor:pointer;}
.rt .ownb{display:block;padding:0 .8vw .4vh;font-size:clamp(11px,.8vw,14px);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#466e86;}
.parkmap .plab{font-family:'Source Sans 3',sans-serif;font-weight:800;fill:#1e3a55;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;}
.parkmap .pin{cursor:pointer;} .parkmap .pin:hover circle{fill:#ff5a22;}
.mrows{margin-top:2.6vh;display:grid;gap:.9vh;max-height:52vh;overflow:auto;}
.mrow{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:1vh .9vw;border-radius:10px;background:rgba(255,255,255,.06);text-align:left;}
.mrow:hover{background:rgba(255,255,255,.14);}
.mrow .pn{width:30px;height:30px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;font-weight:800;}
.mrow b{font-size:var(--fs-card);font-weight:600;line-height:1.2;}
.mrow .go{font-size:13px;font-weight:700;color:var(--orange-soft);}
.wrow span em{font-style:normal;font-weight:800;color:#fff;background:rgba(255,255,255,.18);border-radius:4px;padding:0 5px;margin-right:4px;}
/* what matters most (2026-11-13) */
.card .fits{position:absolute;left:10px;top:10px;z-index:2;max-width:calc(100% - 56px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 14px;border-radius:999px;background:#e84610;color:#fff;font-size:clamp(14px,1vw,18px);font-weight:800;letter-spacing:.02em;box-shadow:0 2px 8px rgba(0,0,0,.25);}
.card:has(.ctag) .fits{top:48px;}
.card .ctag{font-size:clamp(13px,.95vw,17px) !important;padding:6px 12px !important;}
.vals{margin-top:1.6vh;font-size:clamp(16px,1.3vw,24px);font-weight:600;color:#fff;line-height:1.5;}
.vals span{display:block;margin-bottom:4px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--orange-soft);}
.vals.big{font-size:var(--fs-sub);margin-top:2vh;}
/* tall photo in a wide box: whole photo over a blurred copy of itself (2026-11-13) */
.fit{background-size:0 0 !important;background-color:#0f1d29;overflow:hidden;}
.ph.fit{position:relative;}
.bg.fit{position:absolute;}
.fit::before{content:'';position:absolute;inset:-40px;background-image:inherit;background-size:cover;background-position:center;filter:blur(22px) brightness(.55) saturate(1.1);}
.fit::after{content:'';position:absolute;inset:0;background-image:inherit;background-size:contain;background-repeat:no-repeat;background-position:center;}
.bg.fit::after{inset:6vh 0 0 0;background-position:right 8vw center;}
.card .ph.fit,.tile .ph.fit,.step .ph.fit,.cmp-col .ph.fit{isolation:isolate;}
.tile .ph.fit{position:absolute;}
/* highlighted cards, made obvious (2026-11-13): thick orange frame, orange label, big check;
   the cards not highlighted step back a little once anything is highlighted */
.card.picked{outline:5px solid var(--orange);outline-offset:3px;box-shadow:0 0 0 10px rgba(232,70,16,.22),0 18px 44px rgba(0,0,0,.5);}
.card.picked .lab{background:var(--orange);}
.card.picked .lab span{color:rgba(255,255,255,.95);}
.card.picked .look{border-color:rgba(255,255,255,.75);}
.card .tick{width:48px;height:48px;font-size:26px;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.4);z-index:3;}
.cards.dense .card .tick{width:36px;height:36px;font-size:19px;top:7px;right:7px;}
.card.partial{outline:4px dashed var(--orange);outline-offset:3px;}
.card.partial .lab{background:rgba(232,70,16,.32);}
.cards.has-pick .card:not(.picked):not(.partial):not(.unsure){opacity:.6;filter:saturate(.7);}
.cards.has-pick .card:not(.picked):hover{opacity:1;filter:none;}
.card .who{right:66px;} .cards.dense .card .who{right:50px;}
.who i{width:32px;height:32px;font-size:14px;}
.cmp-col.picked{outline:5px solid var(--orange);outline-offset:-5px;box-shadow:0 0 0 8px rgba(232,70,16,.2);}
/* results: what you highlighted + the reading guides (2026-11-13) */
.res{position:absolute;inset:0;overflow:auto;background:radial-gradient(ellipse at 80% 0%,#20405a 0%,var(--ink) 55%);padding:10vh 6vw 9vh;}
.res-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3vw;align-items:center;}
.res-head h2{font-family:'Cormorant Garamond',serif;font-size:var(--fs-q);font-weight:600;line-height:1.08;}
.res-head .s{font-size:var(--fs-sub);color:rgba(255,255,255,.78);margin-top:1vh;line-height:1.4;}
.res-head .actions{margin-top:2.6vh;}
.res-wheel{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.7);}
.res-wheel .wheel{width:clamp(150px,12vw,240px);}
.res-wheel:hover .wheel{filter:brightness(1.12);}
.res-wheel svg{pointer-events:none;}
.vals .chip{display:inline-block;margin:6px 8px 0 0;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);font-size:clamp(14px,1.05vw,19px);font-weight:700;}
.res-sec{margin-top:5vh;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;}
.res-sec h3{font-family:'Cormorant Garamond',serif;font-size:clamp(26px,2.3vw,44px);font-weight:600;}
.res-sec p{font-size:var(--fs-body);color:rgba(255,255,255,.7);}
.rboard{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:3vw;margin-top:1.6vh;align-items:start;}
.rside-h{padding-bottom:1vh;border-bottom:2px solid rgba(255,255,255,.18);}
.rside-h .side{font-size:clamp(13px,1vw,17px);color:#fff;}
.rside-h .side i{width:14px;height:14px;}
.rrow{padding:2vh 0;border-top:1px solid rgba(255,255,255,.1);}
.rrow h4{font-family:'Cormorant Garamond',serif;font-size:clamp(22px,1.8vw,34px);font-weight:600;line-height:1.1;margin-bottom:1.2vh;}
.rrow.na{display:flex;align-items:baseline;gap:16px;padding:1.4vh 0;}
.rrow.na h4{font-size:clamp(18px,1.35vw,26px);margin:0;color:rgba(255,255,255,.75);}
.rrow.na .rnone{padding:0;}
.rside-h + .rrow{border-top:0;}

.side{letter-spacing:.18em;text-transform:uppercase;font-weight:800;display:flex;align-items:center;gap:10px;}
.side i{border-radius:50%;}
.rcols{display:grid;gap:2.4vw;}
.rcols.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr);}
.rwho{display:inline-flex;align-items:center;gap:8px;margin-bottom:1.2vh;padding:4px 14px 4px 4px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:700;font-size:clamp(14px,1vw,18px);}
.rwho i{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-weight:800;font-size:13px;}
.rwho i.p0{background:var(--orange);} .rwho i.p1{background:var(--navy);}
.rtiles{display:flex;flex-wrap:wrap;gap:1.2vw;}
.rt{width:clamp(140px,10.2vw,200px);border-radius:14px;overflow:hidden;background:#fff;color:var(--ink);text-align:left;box-shadow:0 10px 28px rgba(0,0,0,.4);display:flex;flex-direction:column;transition:transform .15s;}
.rcols.two .rt{width:clamp(110px,8.6vw,170px);}
.rcols.two .rt b{font-size:clamp(13px,.9vw,17px);}
.rt:hover{transform:translateY(-3px);}
.rt .ph{aspect-ratio:4/3;background-size:cover;background-position:center;position:relative;}
.rt .ph.fit{position:relative;}
.rt b{display:block;padding:1vh .8vw .3vh;font-size:clamp(14px,1.02vw,19px);line-height:1.2;}
.rt small{display:block;padding:0 .8vw 1.1vh;font-size:clamp(12px,.85vw,15px);font-weight:700;color:#c23a0d;}
.rnone{font-size:var(--fs-body);color:rgba(255,255,255,.55);font-style:italic;padding-top:1vh;}
.gls{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,42vw),1fr));gap:1.4vw;margin-top:2.4vh;}
.gl{display:grid;grid-template-columns:42% 1fr;border-radius:14px;overflow:hidden;background:var(--cream);color:var(--ink);text-align:left;box-shadow:0 10px 28px rgba(0,0,0,.4);min-height:clamp(110px,9vw,170px);transition:transform .15s;}
.gl:hover{transform:translateY(-3px);}
.gl .ph{background-size:cover;background-position:center;position:relative;}
.gl .tx{padding:1.6vh 1.1vw;display:flex;flex-direction:column;justify-content:center;gap:.6vh;}
.gl small{font-size:11px;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:var(--orange);}
.gl b{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,1.6vw,30px);font-weight:600;color:var(--navy-deep);line-height:1.1;}
.gl span{font-size:clamp(13px,.95vw,16px);font-weight:700;color:var(--navy);}
/* a full reading guide, opened right here on the screen */
#reader{position:fixed;inset:0;z-index:90;background:var(--ink);display:none;flex-direction:column;}
#reader.on{display:flex;}
#reader .rbar{display:flex;align-items:center;gap:16px;padding:12px 22px;background:var(--ink);border-bottom:1px solid rgba(255,255,255,.15);}
#reader .rtitle{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,1.6vw,30px);font-weight:600;}
#reader .sp{flex:1;}
#reader a.cbtn{color:#fff;text-decoration:none;}
#reader iframe{flex:1;border:0;width:100%;background:#fff;}
@media (max-width:820px){
  .copy{left:6vw;right:6vw;max-width:none;bottom:18vh;}
  .inset-photo{display:none;}
  .wheelwrap,.mapwrap{grid-template-columns:1fr;overflow:auto;}
  .wheel{width:80vw;}
  #chrome .where{display:none;}
  #chrome .logo{height:30px;}
  .cbtn .t{display:none;}
}

/* ── plan screen clarity (11-27) ── */
.plrow{position:relative;}
.glogo{display:block;height:clamp(110px,13vh,170px);width:auto;margin-top:2vh;}
.btn.hide{display:none;}
.plrow.next{border-color:var(--orange) !important;box-shadow:0 0 0 4px rgba(232,70,16,.18);}
.upnext{position:absolute;left:-1px;top:-11px;padding:2px 10px;border-radius:999px;background:var(--orange);color:#fff;font-size:clamp(11px,.75vw,13px);font-weight:800;letter-spacing:.1em;text-transform:uppercase;}
.plrow .mk{padding:9px 16px;font-size:clamp(13px,.95vw,17px);}
.plrow.m-done{background:rgba(70,110,134,.28);}
.plrow.m-no{opacity:.55;}
.plrow .pi{background:rgba(255,255,255,.1);border-radius:999px;padding:3px 12px;margin:2px 6px 2px 0;}
.plrow .pi + .pi::before{content:none;}
/* ── more than one plan, and the faith name tiles (11-27) ── */
.party{margin-top:2vh;text-align:center;}
.party-h{font-size:clamp(12px,.85vw,15px);letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--orange-soft);margin-bottom:1.2vh;}
.party-row{display:flex;justify-content:center;gap:1vw;flex-wrap:wrap;}
.pp-i{display:flex;flex-direction:column;gap:6px;align-items:stretch;}
.pp-b{display:flex;align-items:center;gap:8px;padding:12px 20px;border-radius:999px;border:2px solid rgba(255,255,255,.4);color:#fff;font-weight:700;font-size:clamp(14px,1.05vw,19px);background:rgba(255,255,255,.05);}
.pp-t{width:1.3em;height:1.3em;border-radius:50%;border:2px solid rgba(255,255,255,.5);display:grid;place-items:center;font-size:.75em;color:transparent;}
.pp-i.on .pp-b{border-color:var(--orange);background:rgba(232,70,16,.18);}
.pp-i.on .pp-t{background:var(--orange);border-color:var(--orange);color:#fff;}
.pp-i input{font:inherit;font-size:clamp(13px,.95vw,17px);padding:8px 12px;border-radius:10px;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;}
.party-note{margin-top:1.4vh;font-size:clamp(15px,1.15vw,21px);color:rgba(255,255,255,.88);}
.card.word{min-height:clamp(86px,11vh,130px);}
.card.word{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(150deg,#2d5570,#1a3349);}
.card.word .lab{display:flex;flex-direction:column;justify-content:center;}
.card.word{position:relative;padding-bottom:30px;}
.card.word .look{position:absolute;right:10px;bottom:8px;margin:0;}
.card.word .lab b{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,1.7vw,32px);font-weight:600;}
/* ── round 2 (11-27): everything it takes, before vs when, sizes to scale, the 2x2 shortcut ── */
.kit{margin-top:2.2vh;}
.kit-h{font-size:clamp(11px,.8vw,14px);letter-spacing:.2em;text-transform:uppercase;font-weight:800;color:var(--orange-soft);margin-bottom:1vh;}
.kit-row{display:flex;gap:1.2vw;flex-wrap:wrap;}
.kit-i{display:flex;flex-direction:column;align-items:center;gap:.7vh;width:clamp(86px,7vw,130px);color:#fff;text-align:center;}
.kit-ph{width:clamp(64px,5.2vw,98px);height:clamp(64px,5.2vw,98px);border-radius:50%;background-size:cover;background-position:center;border:3px solid rgba(255,255,255,.85);box-shadow:0 6px 18px rgba(0,0,0,.45);display:grid;place-items:center;}
.kit-i.none .kit-ph{background:rgba(70,110,134,.55);}
.kit-ph svg{width:46%;height:46%;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;}
.kit-i b{font-size:clamp(12px,.88vw,16px);line-height:1.2;font-weight:700;}
button.kit-i:hover .kit-ph{transform:scale(1.06);}
.kit-home{margin-top:1.4vh;font-style:italic;font-size:clamp(14px,1.05vw,19px);color:rgba(255,255,255,.85);}
.ahead{position:absolute;left:7vw;right:7vw;top:13vh;}
.ahead-grid{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:4vh;}
.ahead-col{border-radius:16px;padding:2.6vh 2vw;background:rgba(15,29,41,.72);}
.ahead-col.yes{background:rgba(70,110,134,.82);}
.ahead-h{display:flex;align-items:center;gap:14px;font-family:'Cormorant Garamond',serif;font-size:clamp(26px,2.4vw,44px);font-weight:600;margin-bottom:1.6vh;}
.ahead-ic{width:1.4em;height:1.4em;border-radius:50%;display:grid;place-items:center;font-family:'Source Sans 3',sans-serif;font-size:.7em;font-weight:800;background:rgba(255,255,255,.18);}
.ahead-col.yes .ahead-ic{background:var(--orange);}
.ahead-r{font-size:clamp(16px,1.35vw,24px);line-height:1.35;padding:1.1vh 0;border-top:1px solid rgba(255,255,255,.16);}
.ahead-law{margin-top:2.4vh;font-size:clamp(15px,1.2vw,22px);color:rgba(255,255,255,.88);}
.ahead-law span{margin-left:8px;font-size:.7em;letter-spacing:.08em;color:rgba(255,255,255,.6);}
.shade.full{background:linear-gradient(rgba(15,29,41,.78),rgba(15,29,41,.9));}
.sizes-wrap{position:absolute;left:5vw;right:5vw;top:11vh;}
.sizes-wrap .sub{max-width:none;}
.sizes{width:100%;height:auto;max-height:56vh;margin-top:2vh;}
.sizes-note{font-size:clamp(13px,1vw,18px);color:rgba(255,255,255,.78);margin-top:1vh;}
.hub{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.2vw;margin:2.4vh 0 1vh;}
.hub-t{position:relative;height:clamp(110px,15vh,180px);border-radius:14px;overflow:hidden;text-align:left;color:#fff;}
.hub-ph{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .3s;}
.hub-t:hover .hub-ph{transform:scale(1.05);}
.hub-l{position:absolute;left:0;right:0;bottom:0;padding:1.2vh 1vw;background:linear-gradient(transparent,rgba(15,29,41,.9));display:flex;flex-direction:column;}
.hub-l small{font-size:clamp(11px,.8vw,14px);letter-spacing:.16em;text-transform:uppercase;font-weight:800;color:var(--orange-soft);}
.hub-l b{font-family:'Cormorant Garamond',serif;font-size:clamp(20px,1.7vw,32px);font-weight:600;}
/* ── the end of the visit (11-25): plan marks, did we miss anything, what's next ── */

function effPlace(i) {

function optsFor(q, i) {

  if (q === 'service') return d.flatMap(x => SVC_BY[x]);
  const svc = selP('service', i);
  if (q === 'venue') return svc.some(v => ['b-full','c-full','c-memorial'].includes(v))
    ? ['vn-seatac','vn-com','vn-church', ...(d.includes('burial') ? ['vn-grave'] : []), 'vn-else'] : [];
  if (q === 'viewing') return svc.some(v => ['b-full','c-full','b-private','c-private'].includes(v)) ? ['vw-open','vw-closed','vw-private','vw-none'] : [];
  if (q === 'merch') return [...(d.includes('burial') ? ['k-wood','k-metal'] : []),
    ...(d.includes('cremation') && svc.some(v => ['c-full','c-private'].includes(v)) ? ['k-rental','k-crem'] : []),
    ...(d.includes('cremation') ? ['u-full','u-companion','u-scatter','u-bio'] : []), ...(d.length ? ['mk-unsure'] : [])];
  if (q === 'touches') return ['flowers','reception','catering','t-video','t-photos','t-music','t-register','t-obit'];
  if (q === 'keep') return d.length ? ['ks-print', ...(d.includes('cremation') ? ['ks-urn','ks-glass'] : []), 'ks-no', 'ks-later'] : [];
  if (q === 'place') return owned(i).length ? [] : d.flatMap(x => PLACE_BY[x] || []);
  if (q === 'memorial') {
    // What can go on each kind of place (11-27). Uprights and benches only where they're allowed; lawn crypts are flat granite.
    const p = effPlace(i), out = [], add = (...v) => v.forEach(x => { if (!out.includes(x)) out.push(x); });
    if (owned(i).length || p.includes('famgrave')) add('m-existing');
    if (p.includes('ground') || p.includes('estate')) add('m-bronze', 'm-granite-flat', 'm-upright', 'm-bench');
    if (p.includes('urnground') || p.includes('famgrave')) add('m-bronze', 'm-granite-flat');
    if (p.includes('lawncrypt')) add('m-granite-flat');
    if (p.includes('glass')) add('m-glass');
    if (p.includes('granite')) add('m-granite');
    if (p.includes('mausoleum')) add('m-crypt', 'm-monobar');
    return out;

}

    if (h > AERIAL.h) { h = AERIAL.h; w = h * AR; }
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    vb = [Math.max(0, Math.min(cx - w / 2, AERIAL.w - w)), Math.max(0, Math.min(cy - h / 2, AERIAL.h - h)), w, h];
  }
  const k = vb[2] / 1520;   // keeps pins and text the same size on screen at any zoom
  let s = `<svg class="parkmap" viewBox="${vb.map(v => v.toFixed(1)).join(' ')}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Aerial photo of Washington Memorial Park">`;
  s += `<image href="${AERIAL.src}" x="0" y="0" width="${AERIAL.w}" height="${AERIAL.h}"/>`;
  if (focus) {
    // dim everything except a soft spotlight around each place
    s += `<defs><mask id="spot"><rect x="0" y="0" width="${AERIAL.w}" height="${AERIAL.h}" fill="#fff"/>${pins.map(p => { const a = MAP_PINS[p].area; return a ? `<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="${22 * k}" fill="#000"/>` : `<circle cx="${MAP_PINS[p].x}" cy="${MAP_PINS[p].y}" r="${95 * Math.max(k, .8)}" fill="#000"/>`; }).join('')}${fam.map(p => `<circle cx="${p.x}" cy="${p.y}" r="${95 * Math.max(k, .8)}" fill="#000"/>`).join('')}</mask></defs>
      ${pins.filter(p => MAP_PINS[p].area).map(p => { const a = MAP_PINS[p].area; return `<rect x="${a.x}" y="${a.y}" width="${a.w}" height="${a.h}" rx="${22 * k}" fill="none" stroke="#e84610" stroke-width="${4 * k}" stroke-dasharray="${10 * k} ${7 * k}"/>`; }).join('')}
      <rect x="0" y="0" width="${AERIAL.w}" height="${AERIAL.h}" fill="#0f1d29" opacity=".45" mask="url(#spot)"/>`;
  }
  const NARROW = new Set(['13', '9', '8']);   // strips too thin to label on the whole-park view
  const TWO_LINE = new Set(['14', '15']);   // side by side and narrow: "Garden of" over the name (Martice 11-27: Garden 14 must be named)
  if (!focus) MAP_GARDENS.filter(g => !NARROW.has(g.c)).forEach(g => {
    const fz = (f.gardens ? 26 : 22) * k;
    const near = pins.map(p => MAP_PINS[p]).find(P => Math.abs(P.x - g.x) < 110 * k && Math.abs(P.y - g.y) < 45 * k);
    if (near && (near.n === g.n || !TWO_LINE.has(g.c))) return;   // the pin's list names it (only 14 and 15 move off their pin)
    let y = g.y;
    if (near) { y = near.y + 54 * k; if (y + fz > AERIAL.h) y = near.y - 36 * k; }   // move the name just off the pin, never hide it
    const two = TWO_LINE.has(g.c) && /^Garden of /.test(g.n);
    s += two ? `<text x="${g.x}" y="${y - fz * .45}" text-anchor="middle" class="glab" style="font-size:${fz}px"><tspan x="${g.x}">Garden of</tspan><tspan x="${g.x}" dy="${fz * 1.05}">${esc(g.n.replace(/^Garden of /, ''))}</tspan></text>`
      : `<text x="${g.x}" y="${y}" text-anchor="middle" class="glab" style="font-size:${fz}px">${esc(g.n)}</text>`;
  });
  pins.forEach((key, n) => {
    const p = MAP_PINS[key], r = 22 * Math.max(k, .6);
    s += `<g class="pin" data-pin="${key}" tabindex="0"><circle cx="${p.x}" cy="${p.y}" r="${r}" fill="#e84610" stroke="#fff" stroke-width="${5 * Math.max(k, .6)}"/>
      <text x="${p.x}" y="${p.y + 1}" text-anchor="middle" dominant-baseline="middle" class="pnum" style="font-size:${21 * Math.max(k, .6)}px">${n + 1}</text></g>`;
    const below = focus && pins.slice(0, n).some(o => Math.abs(MAP_PINS[o].x - p.x) < 220 * k && Math.abs(MAP_PINS[o].y - p.y) < 70 * k) && n % 2 === 1;
    if (focus) s += `<text x="${p.x}" y="${below ? p.y + r + 26 * Math.max(k, .6) : p.y - r - 10 * k}" text-anchor="middle" class="plab" style="font-size:${20 * Math.max(k, .6)}px">${esc(p.n)}</text>`;
  });
  fam.forEach(p => {
    const r = 18 * Math.max(k, .6), m = Math.max(k, .6);
    s += `<g class="fpin"><circle cx="${p.x}" cy="${p.y}" r="${r}" stroke-width="${5 * m}"/><text x="${p.x}" y="${p.y + 1}" text-anchor="middle" dominant-baseline="middle" class="fnum" style="font-size:${19 * m}px">♥</text></g>
      <text x="${p.x}" y="${p.y - r - 10 * m}" text-anchor="middle" class="plab" style="font-size:${20 * m}px">${esc(p.name || 'Family')}</text>`;
  });
  s += `<text x="${vb[0] + vb[2] - 12 * k}" y="${vb[1] + vb[3] - 12 * k}" text-anchor="end" class="credit" style="font-size:${13 * k}px">Aerial: King County, 2025</text>`;
  return s + `</svg>`;
}

           {q:'What if the family disagrees?',a:'Without a plan, a majority of adult children has to agree, and that can take time. A plan settles it before anyone has to ask.'}],
      link:{href:'who-decides-guide.html', t:'Open the full Who Decides guide'}}},
  'medicaid':{side:'plan', title:'If Medicaid is part of the picture', img:IMG.bigTree, kicker:'Medicaid',
    h:'If Medicaid is part of the picture', s:"Medicaid doesn't count cemetery property against the limit, and a funeral plan can be protected too. These rules were written on purpose.",
    deep:{k:'How it works', h:'What Medicaid leaves out', lead:"Medicaid pays for nursing home care only after most savings are spent. It doesn't count everything.",
      steps:[{n:1,h:'Cemetery property',p:'Left out of the total entirely, with no limit and nothing extra to sign.'},
             {n:2,h:'For close family too',p:'A spouse, parents, children, siblings, and their spouses. All of it is protected.'},
             {n:3,h:'The funeral plan',p:"Protected in full when it's made irrevocable. That means giving up the right to take the money back."},
             {n:4,h:'Ask the right people',p:"We're not lawyers, and we don't decide who qualifies. An elder law attorney or the state does."}],
      faq:[{q:'What does irrevocable mean?',a:'You give up the right to cancel and get a refund. You can still move the plan to another funeral home later.'},
           {q:'Is this a loophole?',a:'No. The state would rather a funeral be paid for ahead of time than become somebody else\'s problem later.'}],
      link:{href:'medicaid-family-guide.html', t:'Open the full Medicaid guide'}}},
  'cost':{side:'plan', title:'What drives the cost', img:IMG.urnCatalog, kicker:'Being frank about cost',
    h:'What drives the cost', s:"Cremation usually costs less for one reason: placement isn't required. Choose the same things, and the two land closer than most families expect.",
    deep:{k:'The big pieces', h:'Where the money goes', lead:"I'll price everything on paper so you're comparing real numbers. Here's what moves the total.",
      steps:[{n:1,h:'Placement',p:'A burial needs a space, a vault, an opening and closing, and a marker. A cremation needs none of those unless you want them.'},
             {n:2,h:'A viewing',p:"A public viewing usually means preparation and a casket. A memorial service after cremation doesn't."},
             {n:3,h:'The casket or urn',p:'The widest range of any choice. A rental casket works for a viewing before cremation, and you can always bring your own.'},
             {n:4,h:'Sharing a space',p:'A casket and an urn can share one ground space. That costs considerably less than two spaces.'},
             {n:5,h:'The day',p:'Fridays, weekends, holidays and services after 3 p.m. carry an extra charge. A flexible day saves money.'},
             {n:6,h:'Planning now',p:"What you choose today is bought at today's prices."}],
      faq:[{q:'Why do your prices run higher than some funeral homes?',a:"We run our own crematory and do our own transfers. Nothing is handed to a third party, and that's also why a family can be present for a cremation here."},
           {q:'Can you price two options side by side?',a:"Yes. I'll put both on paper so you're comparing real numbers. There's no cost to ask."}],
      link:{href:'cremation-or-burial-guide.html', t:'Open the Cremation or Burial guide'}}},
  'service-places':{side:'funeral', title:'Where the service can be', img:IMG.seatacChapel, kicker:'The service',
    h:'Where the service can be', s:'Our SeaTac chapel, the small chapel in the Chapel of Memories, your own church, the graveside, or somewhere that meant something.',
    deep:{k:'The places', h:'Where families gather', lead:'Wherever it is, we plan it with you.',
      steps:[{img:IMG.seatacChapel,h:'Our SeaTac chapel',p:'Attached to our main building, steps from the cemetery, with screens for a video tribute.'},
             {img:IMG.mChapel,h:'The small chapel',p:'Inside the Chapel of Memories mausoleum, for a smaller service.'},
             {img:IMG.vaultGrave,h:'At the graveside',p:'A tent and seating at the grave.'},
             {img:IMG.pond,h:'Somewhere else',p:'A church, a hall, a park, a home. Wherever fits.'}],
      faq:[{q:'Who leads the service?',a:"Clergy, a celebrant, or someone from the family. If you don't have someone in mind, tell me."},
           {q:'Can we have more than one?',a:'Yes. Some families hold a private service first and a larger one later.'}]}},
  'viewing':{side:'funeral', title:'Seeing them one last time', img:IMG.chapelCasket, kicker:'The service',
    h:'Seeing them one last time', s:'Some families find it helps to see their person again. Others would rather remember them as they were. Both are right.',
    deep:{k:'The choices', h:'Ways to say goodbye in person', lead:'You can decide this now, or leave it for the family.',
      steps:[{img:IMG.chapelCasket,h:'An open casket',p:'Family and friends see their loved one at the viewing.'},
             {img:IMG.chapelSet,h:'A closed casket',p:'The casket is there, but closed.'},
             {img:IMG.privateView,h:'Private family time',p:'A short, quiet time for close family only.'},
             {img:IMG.tree,h:'No viewing',p:'Remember them as they were.'}],
      faq:[{q:'Is embalming required?',a:"No. Washington law doesn't require it. If you'd like a public viewing, we'll talk through whether it's needed."},
           {q:'What if we choose cremation?',a:'You can still have a viewing first. A rental casket is used, and the cremation follows.'}],
      link:{href:'burial-guide.html', t:'Open the Burial Guide'}}},
  'tributes':{side:'funeral', title:'Making it theirs', img:IMG.display, kicker:'Personal touches',
    h:'Making it theirs', s:'Their photos, their music, their story. These are the touches people remember.',
    deep:{k:'The touches', h:'Ways to make the day theirs', lead:'Pick one or pick them all. Every one of these can be added later, too.',
      steps:[{img:IMG.seatacChapel,h:'A video tribute',p:'Photos set to music, played on the chapel screens.'},
             {img:IMG.display,h:'Photos and keepsakes',p:'A table of their photos and the things they loved.'},
             {img:IMG.register,h:'A register book',p:'Everyone who comes signs it, and the family keeps it.',contain:true},
             {img:IMG.casketPers,h:'On the casket',p:'Panels, corner pieces and engraving that reflect their life.'}],
      faq:[{q:'What about an obituary?',a:"We'll help write it. It can go on our website, in the newspaper, or both. Newspapers price by length."},
           {q:'Can we choose the music?',a:'Yes. Their songs, their hymns, whatever sounds like them.'}]}},
  'keepsakes':{side:'funeral', title:'Something to keep close', img:IMG.artful, inset:true, portrait:false, kicker:'Personal touches',
    h:'Something to keep close', s:'Small things the family can hold on to: a fingerprint, a little of the ashes, a piece of glass art.',
    deep:{k:'Keepsakes', h:'Three ways to keep them close', lead:'Most families choose one or two, so more than one person has something.',
      steps:[{img:IMG.ltRange,h:'Fingerprint jewelry',p:'Legacy Touch turns their fingerprint into a pendant, a ring or a keychain.'},
             {img:IMG.keepsake,h:'Keepsake urns',p:'A small portion of the ashes, so more than one person can keep some close.',contain:true},
             {img:IMG.artful,h:'Glass art',p:'Artful Ashes seals a little of the ashes inside a glass heart, orb or starfish.',contain:true}],
      faq:[{q:'Does fingerprint jewelry need cremation?',a:'No. It works with burial or cremation.'},
           {q:'Where is the glass art made?',a:'In Seattle, by Artful Ashes.'}],
      link:{href:'keepsake-urns-guide.html', t:'Open the Keepsake Urn Catalog'}}},

  'cremation':{side:'funeral', title:'Cremation, here on site', img:IMG.crematory, kicker:'Cremation',
    h:'Cremation, here on site', s:'We run our own crematory, here at Washington Memorial Park. Your loved one never leaves our care.',
    deep:{k:'How it works', h:'What actually happens', lead:'Our own staff bring your loved one into our care and do the cremation here. Nothing is handed to a third party at any step.',
      steps:[{n:1,h:'Checked in and given a number',p:'A numbered steel disc is assigned and stays with them the whole way through.'},
             {n:2,h:'Placed in a simple container',p:"A rigid container is required. A casket isn't."},
             {n:3,h:'Identity checked again',p:'Before cremation, the paperwork and the disc are confirmed one more time.'},
             {n:4,h:'Cremation',p:"It takes about three to four hours, one person at a time. Washington law doesn't allow more than one at once without written permission."},
             {n:5,h:'Cooled and processed',p:'Metal from implants or fillings is removed. What remains is processed to a fine, even texture.'},
             {n:6,h:'Returned to you, with the disc',p:"An adult's cremated remains usually weigh 4 to 6 pounds. They're bone, not ash."}],
      faq:[{q:'Is a casket required?',a:"No. Washington law doesn't require a casket for cremation. A simple container is used. If you'd like a viewing first, a casket can be rented for it."},
           {q:'Can we still have a viewing and a service?',a:"Yes. Cremation is a way of caring for the body, not a smaller funeral. A viewing, a full service and military honors are all still yours."},
           {q:'What about a pacemaker or jewelry?',a:"A pacemaker is removed beforehand. Jewelry is normally removed too, unless you tell us otherwise, because cremation can't be undone."},
           {q:'Who signs for the cremation?',a:"Whoever Washington law puts first, unless you settle it yourself in writing. A signed pre-arrangement does exactly that."},
           {q:'Can we be there?',a:'Yes. A witness cremation lets family and friends be present at the beginning, to honor a tradition or for their own closure.'},
           {q:'Can we see the crematory?',a:"Yes. You're welcome to tour it."}],
      link:{href:'cremation-guide.html', t:'Open the full Cremation Guide'}}},
  'svc-c-full':{side:'funeral', title:'A viewing and service, then cremation', img:IMG.chapelCasket, kicker:'The service',
    h:'A viewing and service, then cremation', s:'Family and friends gather with your loved one present. Cremation comes after.', deep:SERVICE_DEEP},
  'svc-c-memorial':{side:'funeral', title:'A memorial service with the urn', img:IMG.seatacChapel, kicker:'The service',
    h:'A memorial service with the urn', s:'Cremation comes first. The service is held afterward, with the urn present, days or even weeks later.', deep:SERVICE_DEEP},
  'svc-c-private':{side:'funeral', title:'A private family viewing', img:IMG.privateView, kicker:'The service',
    h:'A private family viewing', s:'A short, quiet time for close family to say goodbye before cremation.', deep:SERVICE_DEEP},
  'svc-c-direct':{side:'funeral', title:'Cremation without a service', img:IMG.hearse, kicker:'The service',
    h:'Cremation without a service', s:"No service, just the cremation. You're free to gather on your own, whenever and wherever you like.", deep:SERVICE_DEEP},
  'svc-c-witness':{side:'funeral', title:'Being there for the cremation', img:IMG.crematoryWitness, kicker:'The service',
    h:'Being there for the cremation', s:'A witness cremation lets family and friends be present at the beginning of the cremation, here at our own crematory.',
    deep:{k:'Witness cremation', h:'Why families choose it', lead:'Family and friends may gather to see their loved one before they are placed into the cremation chamber.',
      steps:[{n:1,h:'Faith and tradition',p:"For many families, it's a religious, spiritual or cultural tradition."},
             {n:2,h:'Closure',p:'Some people find peace in being there for the last step.'},
             {n:3,h:'Knowing',p:'Some just want to see it for themselves.'}],
      faq:[{q:'Is it at the crematory?',a:'Yes. Our crematory is on site at Washington Memorial Park, so it happens here, with our own team guiding you through it.'},
           {q:'Can we start it ourselves?',a:"Yes. If it matters to your family, you can press the button that begins the cremation."},
           {q:'Can it be combined with a service?',a:'Yes. It can follow a viewing or a service, or stand on its own.'}]}},

  'flowers':{side:'funeral', title:'Flowers', img:IMG.flStanding, logo:'flower-images/loves-logo-white.png', inset:true, portrait:false, kicker:'Personal touches', vs:'grave-flowers',
    h:'Flowers', s:"Our flowers come from Love's Buds & Blooms, here in SeaTac. I can show you the whole catalog.",

  'reception':{side:'funeral', title:'A reception after', img:IMG.receptionRoom, kicker:'Personal touches',
    h:'A place to gather after', s:'We host receptions in our chapel, at cloth-covered tables, so nobody has to go home to host.',
    deep:{k:'The reception', h:'Right here, after the service', lead:'Family and friends can stay, talk, and share a meal right after the service.',
      steps:[{img:IMG.receptionRoom,h:'Room for everyone',p:'Tables set with cloths in our chapel, for a sit-down meal.'},
             {img:IMG.catering,h:'Catering if you want it',p:'Our catering partner, Arista, sets up, serves and clears away.'}]}},

    h:'Catering, taken care of', s:'Our catering partner, Arista, sets up, serves, and clears away, so the family can just be together.',
    deep:{k:'The menus', h:'Three ways to feed everyone', lead:'Every package includes setup and tear-down, an attended buffet, chafing dishes, linens and gratuity.',
      steps:[{n:1,h:'Breakfast receptions',p:'The Southwest Spread, the Capitol Hill Special, and the Green Lake Gourmet Continental.'},

  'urns':{side:'funeral', title:'Choosing an urn', img:IMG.urnCatalog, kicker:'The urn',
    h:'Choosing an urn', s:'The urn holds what comes home. Some are made for one person, some for two, and some for scattering.',
    deep:{k:'The kinds of urns', h:'Five ways an urn can work', lead:'Pick the kind first. The style comes after.',
      steps:[{img:IMG.urnFull,h:'Full-size',p:'Holds everything, for one person.',contain:true},
             {img:IMG.urnCompanion,h:'Companion',p:'Made to hold two people together.',contain:true},
             {img:IMG.keepsake,h:'Keepsake',p:'A small portion, so more than one family member can keep some close.',contain:true},
             {img:IMG.urnScatter,h:'Scattering',p:'Made to open easily when the time comes.',contain:true},
             {img:IMG.urnBio,h:'Biodegradable',p:'Returns to the earth or the water with the remains.',contain:true}],
      faq:[{q:'Can I bring an urn from somewhere else?',a:"Yes. You can always supply your own, and we don't charge a fee for using it."},
           {q:'Does the urn show in a niche?',a:"In a glass-front niche, yes. The urn is part of what visitors see. In a granite niche it's out of sight."}],
      link:{href:'urns-guide.html', t:'Open the Urn Catalog'}}},
  'glass-niche':{side:'cemetery', title:'Glass-front niches', img:IMG.glassRoom, kicker:'Where you rest', map:'glass', vs:['glass-vs-granite', 'niche-placing', 'name-plates'],
    h:'Glass-front niches', s:'Indoors, out of the weather. The urn and the things that tell your story stay in view behind glass.',
    deep:{k:'Four places to choose from', h:'Where the glass-front niches are', lead:'All four are indoors, so you can visit in any weather. Most niches hold two urns, and the large family niches on the Mountain View island hold four.',
      steps:[{img:IMG.eclFace,h:'Eternal Light Columbarium',p:'Inside the Eternal Light Mausoleum, attached to the Chapel of Memories.'},
             {img:IMG.mvcIsland,h:'Mountain View Columbarium',p:'A building of its own, with a new island of niches.'},
             {img:IMG.radWall,h:'Radiance',p:'A wall of niches inside the Chapel of Memories.'},
             {img:IMG.serWall,h:'Serenity',p:'A second wall inside the Chapel of Memories.'}],
      faq:[{q:'How many urns fit in one niche?',a:'Most hold two, so a couple shares one. The four large family niches on the Mountain View island hold four. The Veterans Court of Honor niches hold one.'},
           {q:'What can go inside with the urn?',a:"Photographs, keepsakes, a folded flag, a rosary. It's yours to fill."},
           {q:'Glass or granite, which is better?',a:"Neither one is better. They're built for the same purpose and cared for the same way. The real choice is whether the urn and the keepsakes should be seen."}],
      link:{href:'glass-front-niches-guide.html', t:'Open the full Glass-Front Niches guide'}}},
  'niche-placing':{side:'cemetery', title:'Placing the urn', btn:'On the day', img:IMG.nicheTable, kicker:'Opening and closing',
    h:'Placing the urn', s:'On the day, the niche is opened, the urn is placed inside, and the niche is closed again.',
    deep:{k:'How it works', h:'What opening and closing covers', lead:"It's the work of placing the urn, and our own cemetery staff do it.",
      steps:[{img:IMG.eclOpen,h:'The niche is opened',p:'The front is removed.'},
             {img:IMG.eclInPlace,h:'The urn is placed',p:'Along with anything you chose to keep with it.'},
             {img:IMG.eclFront,h:'The niche is closed',p:'The front goes back on and the name goes on it.'},
             {img:IMG.nicheBouquet,h:'Coming back',p:'You can bring flowers and sit a while.'}],
      faq:[{q:'Is this the same as buying the niche?',a:'No. The niche is the property itself. Opening and closing is the service of placing the urn, which happens when the time comes.'}]}},
  'niche-memorial':{side:'cemetery', title:'Remembered in a niche', img:IMG.eclCloseup, kicker:'Memorial',
    h:'Your name, and what you loved', s:'The name goes on a plate or engraved strip. Inside, the photographs and keepsakes tell the rest.',
    deep:{k:'Up close', h:'What a glass-front niche looks like', lead:'Every family makes theirs different.',
      steps:[{img:IMG.eclFront,h:'The front',p:'A single pane of glass over the compartment.'},
             {img:IMG.eclCloseup,h:'Inside',p:'The urn, with what the family chose to place beside it.'},
             {img:IMG.nicheBouquet,h:'Visiting',p:'You can bring flowers and sit a while.'}]}},
  'veterans':{side:'cemetery', title:'Honoring your service', img:IMG.vetsFlags, kicker:'Veterans', map:'vets',
    h:'Honoring your service', s:'Washington Memorial Park has two gardens set aside for veterans and their families, and the POW/MIA Living Memorial Plaza.',
    deep:{k:'What the VA provides', h:'For burial here, in a private cemetery', lead:'Start with the DD-214. It opens everything below.',
      steps:[{img:IMG.vetsDrone,h:'A marker or medallion',p:'A government headstone, flat marker, or a medallion for a private one.'},
             {img:IMG.vetsPlaza,h:'Military funeral honors',p:'At least two uniformed members, the folding and presenting of the flag, and Taps.'},
             {img:IMG.vetsFlags,h:'A burial flag and certificate',p:'The flag, and a Presidential Memorial Certificate signed by the President.'}],
      faq:[{q:'Can my spouse be on my VA headstone?',a:"If the veteran died on or after October 1, 2019, the spouse's name and dates can be added to the veteran's VA headstone."},
           {q:'What about Tahoma National Cemetery?',a:"Tahoma in Kent is the other choice, at no cost for the space. There, the committal is a 30-minute service in a shelter, not at the grave, and the grave is assigned the day before. Here, you choose the spot ahead of time and the service can be right at the graveside. People choose here to be with family, for the setting, or to be close by. I can go through both with you."}],
      link:{href:'veterans-guide.html', t:'Open the full Veterans Guide'}}},
  'travel':{side:'funeral', title:'If something happens far from home', img:P+'travel-often.svg', plain:'globe', kicker:'Travel protection', vs:['travel-call', 'travel-compare'],
    h:'If something happens far from home', s:'Getting someone home after a death 75 miles or more away is hard on a family. The Travel Plan by Inman handles it with one call.',
    deep:{k:'How it works', h:"One call, and it's handled", lead:"If someone dies away from home, the family calls Inman before arranging anything. That's the part to remember.",
      steps:[{n:1,h:'75 miles or more from home',p:"Or anywhere in another country. That's when it applies."},
             {n:2,h:'Any age, no health questions',p:'Nobody is turned down for age or for health.'},
             {n:3,h:'One fee, paid once',p:'No renewal, no annual bill, nothing that lapses.'},
             {n:4,h:'Call Inman first: 888-889-8508',p:'They bring your person home to us.'}],
      faq:[{q:'Is this travel insurance?',a:"No. It doesn't cover trip costs or medical bills. It brings a person home after a death."},
           {q:'Is it worth it for us?',a:"If nobody in your family goes more than an hour from home, it probably isn't, and I'll tell you that. If someone spends part of the year in another state, or family goes back overseas, it pays for itself the first time it's needed."},
           {q:'Who can we enroll?',a:"Anyone, at any age, and you can buy it for somebody else. The person covered doesn't have to be the person paying, and they don't have to live with you."},
           {q:'What counts as home?',a:'Your legal residence, the full-time home you live in. 180 days or more at an address in the year before counts, and that includes a nursing home.'},
           {q:"What if we're already on a trip?",a:"It takes effect once you're home again, for later travel. It won't cover the trip you're already on."},
           {q:"What if we're still paying for it?",a:'If someone on a payment plan dies while the payments are current, the rest are forgiven and Inman fulfills the plan anyway.'},
           {q:'What about going overseas?',a:'Unlimited international travel. Inman asks for a quick call to their Service Center first, and it costs nothing.'},
           {q:'Does a trip for surgery count?',a:"No. Traveling somewhere for a medical procedure isn't covered."},
           {q:'What comes in the mail?',a:'A welcome letter, a wallet-size member ID card, and a change of address card.'}],
      link:{href:'inman-travel-plan-guide.html', t:'Open the full Travel Plan guide'}}},
  'grave-flowers':{side:'cemetery', title:'Flowers at the grave, all year', img:P+'bb-fresh-bouquet.jpg', logo:'flower-images/loves-logo-white.png', inset:true, kicker:'A place to visit', btn:'Flowers at the grave',
    h:'Flowers at the grave, all year', s:"When you can't be here on the days that matter, Love's Buds & Blooms can be. Their shop is right here on the grounds.",
    deep:{k:'Floral placement', h:'On the days you choose', lead:"Pick a fresh-cut bouquet, a long-lasting blooming plant, or a silk arrangement that lasts. They place it at the grave on a birthday, the holidays, an anniversary, Memorial Day, or any day that matters to you.",
      steps:[{img:P+'bb-fresh-bouquet.jpg',contain:true,h:'On the days that matter',p:"Fresh flowers at the grave on the dates you pick, even when time or distance keeps you away."},
             {img:P+'bb-sunflowers.jpg',contain:true,h:'Through the seasons',p:'A blooming bulb plant in March, sunflowers in July, fall colors in October, a red and white wreath in December.'},
             {img:P+'bb-fall-colors.jpg',contain:true,h:'Every week or every month',p:"So there's always a tribute there, whenever your family comes to visit."}],
      faq:[{q:'Who do we call?',a:"Love's Buds & Blooms, at (206) 241-0360. Their shop is on the grounds of Washington Memorial Park."},
           {q:'Can we ask for something special?',a:'Yes. Their designer can upgrade to premium flowers or a deluxe size, or take a custom request.'}]}},
  'travel-call':{side:'funeral', title:'Call Inman first', img:P+'travel-some.svg', plain:'globe', kicker:'Travel protection', btn:'What one call covers', vs:'travel-compare',
    h:'Call Inman first', s:"Before arranging anything, the family calls Inman at 888-889-8508. Somebody answers 24 hours a day, every day of the year. It isn't a plan that pays you back later: Inman makes the arrangements.",
    deep:{k:'One call', h:'What that one call takes care of', lead:"If the family hires a funeral home where it happened and calls Inman afterward, those costs aren't covered. So the call comes first.",
      steps:[{n:1,h:'Finding a funeral home',p:'A licensed funeral home or embalming service center near the place of death.'},
             {n:2,h:'Bringing them into care',p:'Transport from the place of death to that facility.'},
             {n:3,h:'Preparing them to travel',p:'The preparation required before a person can be flown.'},
