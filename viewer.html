<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading… · Bonney Watson</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Source+Sans+3:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#3d5a7a; --navy-dark:#2c445e; --orange:#c8540a; --orange-dark:#a5450a; --white:#ffffff;
  --offwhite:#f4f6f8; --cream:#f8f6f2; --warm-border:#e6e1d7; --rule:#ddd6c8;
  --gray-light:#f0f4f8; --gray-mid:#c8d4de; --gray-dark:#5a6a7a;
  --text:#3a4453; --text-dark:#1a2332; --text-light:#5a6a7a; --muted:#9aaab8;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Source Sans 3',sans-serif;font-size:14px;background:var(--offwhite);color:var(--text);display:flex;flex-direction:column;}

/* HEADER */
.site-header{background:var(--navy);padding:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);flex-shrink:0;}
.header-inner{max-width:1400px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:16px;}
.header-logo{height:22px;width:auto;flex-shrink:0;}
.header-est{font-family:'Cormorant Garamond',serif;font-size:12px;color:rgba(255,255,255,.5);font-style:italic;white-space:nowrap;}
.header-title{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;color:#fff;letter-spacing:.02em;white-space:nowrap;}
.header-spacer{flex:1;}
.header-back{color:#fff;font-size:12px;font-weight:600;text-decoration:none;padding:6px 12px;border:1px solid rgba(255,255,255,.3);border-radius:6px;white-space:nowrap;transition:background .15s;}
.header-back:hover{background:rgba(255,255,255,.12);}

/* TOOLBAR */
.toolbar{background:var(--white);border-bottom:1px solid var(--gray-mid);padding:10px 24px;display:flex;align-items:center;gap:14px;flex-shrink:0;}
.toolbar-title{font-family:'Cormorant Garamond',serif;font-size:16px;font-weight:700;color:var(--navy);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.toolbar-meta{color:var(--muted);font-size:12px;white-space:nowrap;}
.toolbar-btn{padding:7px 14px;border-radius:7px;font-family:'Source Sans 3',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;transition:transform .1s,box-shadow .15s;text-decoration:none;}
.toolbar-btn:active{transform:scale(.97);}
.btn-print{background:var(--gray-light);color:var(--navy);border:1px solid var(--gray-mid);}
.btn-print:hover{background:var(--gray-mid);}
.btn-download{background:var(--orange);color:#fff;box-shadow:0 2px 8px rgba(200,84,10,.25);}
.btn-download:hover{background:#b34a08;}
.btn-open{background:var(--navy);color:#fff;}
.btn-open:hover{background:var(--navy-dark);}

/* PDF VIEWER */
.viewer-wrap{flex:1;display:flex;align-items:stretch;justify-content:center;background:#525659;position:relative;overflow:hidden;}
.viewer-wrap iframe,
.viewer-wrap embed,
.viewer-wrap object{width:100%;height:100%;border:none;}
.viewer-fallback{display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#ccc;text-align:center;padding:40px;}
.viewer-fallback .icon{font-size:48px;opacity:.5;}
.viewer-fallback p{font-size:14px;color:#aaa;max-width:400px;}
.viewer-fallback a{color:var(--orange);font-weight:600;text-decoration:none;}
.viewer-fallback a:hover{text-decoration:underline;}

/* LOADING STATE */
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#525659;z-index:10;transition:opacity .3s;}
.loading.hidden{opacity:0;pointer-events:none;}
.spinner{width:32px;height:32px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* PRINT: just the PDF */
@media print{.site-header,.toolbar{display:none;}.viewer-wrap{position:static;height:auto;}}
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <img src="logo.svg" alt="Bonney Watson" class="header-logo">
    <span class="header-est">Est. 1868</span>
    <div class="header-title">Family Guides &amp; Resources</div>
    <div class="header-spacer"></div>
    <a class="header-back" href="guides.html">&larr; All Guides</a>
  </div>
</header>

<div class="toolbar">
  <div class="toolbar-title" id="docTitle">Loading&hellip;</div>
  <span class="toolbar-meta" id="docMeta"></span>
  <button class="toolbar-btn btn-print" id="btnPrint" onclick="printPDF()">&#x1f5a8;&#xfe0f; Print</button>
  <a class="toolbar-btn btn-open" id="btnOpen" href="#" target="_blank" rel="noopener">Open in Tab</a>
  <a class="toolbar-btn btn-download" id="btnDownload" href="#" download>&#x2b07;&#xfe0f; Download</a>
</div>

<div class="viewer-wrap" id="viewerWrap">
  <div class="loading" id="loading"><div class="spinner"></div></div>
  <div class="viewer-fallback" id="fallback">
    <div class="icon">&#x1f4c4;</div>
    <p>Your browser can't display this PDF inline. Click below to open or download it instead.</p>
    <a id="fallbackLink" href="#">Open PDF &rarr;</a>
  </div>
</div>

<script>
(function(){
  var params = new URLSearchParams(window.location.search);
  var file = params.get('file');
  var title = params.get('title') || '';
  var meta = params.get('meta') || '';

  if (!file) {
    document.getElementById('docTitle').textContent = 'No file specified';
    document.getElementById('loading').classList.add('hidden');
    return;
  }

  // Decode in case it's URL-encoded
  file = decodeURIComponent(file);

  // Set toolbar info
  if (title) {
    document.title = title + ' · Bonney Watson';
    document.getElementById('docTitle').textContent = title;
  } else {
    var name = file.split('/').pop().replace('.pdf', '');
    document.title = name + ' · Bonney Watson';
    document.getElementById('docTitle').textContent = name;
  }
  if (meta) document.getElementById('docMeta').textContent = meta;

  // Set download/open links
  document.getElementById('btnDownload').href = file;
  document.getElementById('btnOpen').href = file;
  document.getElementById('fallbackLink').href = file;

  // Try to embed the PDF
  var wrap = document.getElementById('viewerWrap');
  var loading = document.getElementById('loading');

  // Use object tag with iframe fallback
  var obj = document.createElement('object');
  obj.type = 'application/pdf';
  obj.data = file;
  obj.style.width = '100%';
  obj.style.height = '100%';

  // If object fails, show fallback
  obj.onerror = function() {
    obj.style.display = 'none';
    document.getElementById('fallback').style.display = 'flex';
    loading.classList.add('hidden');
  };

  // For browsers that support it, also add an iframe inside as fallback
  var iframe = document.createElement('iframe');
  iframe.src = file;
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = 'none';
  obj.appendChild(iframe);

  wrap.appendChild(obj);

  // Hide loading after a delay (object load events are unreliable)
  setTimeout(function(){ loading.classList.add('hidden'); }, 1500);

  // Check if PDF actually rendered after 3s
  setTimeout(function(){
    try {
      if (obj.offsetHeight < 50) {
        obj.style.display = 'none';
        document.getElementById('fallback').style.display = 'flex';
      }
    } catch(e){}
  }, 3000);
})();

function printPDF() {
  var params = new URLSearchParams(window.location.search);
  var file = params.get('file');
  if (file) {
    var w = window.open(file, '_blank');
    if (w) {
      w.addEventListener('load', function(){ setTimeout(function(){ w.print(); }, 500); });
    }
  }
}
</script>

</body>
</html>
